name: Fix KV-GSV v14 kgsvV9 compatibility

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch kgsvV9 compatibility helpers
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          repo = Path.cwd()
          targets = [p for p in [repo / 'docs' / 'index1.html', repo / 'docs' / 'index.html'] if p.exists()]
          if not targets:
              print('[ERROR] Fant verken docs/index1.html eller docs/index.html')
              sys.exit(1)

          shim = r'''
          <script id="kgsv-v14-v9-kompat-shim">
          /* === KV-GSV v14: v9-kompatible helperfunksjoner ===
             Årsak: noen eldre patchlinjer i loadRoadsAround bruker kgsvV9Text/
             kgsvV9HasKvG/kgsvV9IsTrafG/kgsvV9IsGsvType, mens v12/v13 fjernet
             selve v9-blokken. Disse window-helperne gjør at gamle kall ikke stopper
             vegnettlasting. */
          (function(w){
            function ownText(v){
              if(v==null) return '';
              if(typeof v==='string' || typeof v==='number' || typeof v==='boolean') return String(v);
              if(Array.isArray(v)) return v.map(ownText).join(' ');
              if(typeof v==='object'){
                return [v.kode,v.verdi,v.navn,v.name,v.tekst,v.value,v.id,v.beskrivelse,v.kortform]
                  .map(ownText).filter(Boolean).join(' ');
              }
              return String(v);
            }
            function text(v){
              try{
                if(w.kgsvV12Text && w.kgsvV12Text!==text) return w.kgsvV12Text(v);
                if(w.kgsvV13Text && w.kgsvV13Text!==text) return w.kgsvV13Text(v);
              }catch(e){}
              return ownText(v);
            }
            function upper(v){
              return text(v).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
            }
            function isTrafG(v){
              const s = upper(v);
              return /(^|[^A-Z])G([^A-Z]|$)/.test(s) ||
                     s.includes('GAENDE') || s.includes('GÅENDE') ||
                     s.includes('SYKLENDE') ||
                     (s.includes('GANG') && s.includes('SYKKEL'));
            }
            function isGsvType(v){
              const s = upper(v);
              return s.includes('GANG- OG SYKKEL') ||
                     s.includes('GANG OG SYKKEL') ||
                     s.includes('GANG/SYKKEL') ||
                     s.includes('SYKKELVEG') || s.includes('SYKKELVEI') ||
                     s.includes('GANGVEG') || s.includes('GANGVEI');
            }
            function hasKvG(v){
              const s = text(v);
              return /\bKV\s*\d+\s+G\b/i.test(s) ||
                     /\bK\s*V\s*\d+\s+G\b/i.test(s) ||
                     /^Kv\d+G/i.test(s) || /^KV\d+G/i.test(s);
            }
            function catOf(o){
              try{
                if(w.kgsvV12CatOf) return String(w.kgsvV12CatOf(o)||'').toUpperCase();
                if(w.kgsvV13CatOf) return String(w.kgsvV13CatOf(o)||'').toUpperCase();
              }catch(e){}
              let k = String(o && (o.kat ?? o.vegkategori ?? o.kategori) || '').toUpperCase();
              if(k==='EV') return 'E'; if(k==='RV') return 'R'; if(k==='FV') return 'F'; if(k==='KV') return 'K';
              if(['E','R','F','K'].includes(k)) return k;
              const s = upper(o && (o.veg || o.key || o.kortform || o.vegsystemreferanse));
              if(/\bEV\s*\d+|^EV\d+/.test(s)) return 'E';
              if(/\bRV\s*\d+|^RV\d+/.test(s)) return 'R';
              if(/\bFV\s*\d+|^FV\d+/.test(s)) return 'F';
              if(/\bKV\s*\d+|^KV\d+|^KV/.test(s)) return 'K';
              return k;
            }
            function isKvGsv(r){
              try{
                if(w.kgsvV12IsKvGsv) return !!w.kgsvV12IsKvGsv(r);
                if(w.kgsvV13IsKvGsv) return !!w.kgsvV13IsKvGsv(r);
              }catch(e){}
              return catOf(r)==='K' && (
                isTrafG(r && r.trafikantgruppe) ||
                isTrafG(r && r.vegsystemreferanse && r.vegsystemreferanse.strekning && r.vegsystemreferanse.strekning.trafikantgruppe) ||
                isTrafG(r && r.vegsystem && r.vegsystem.strekning && r.vegsystem.strekning.trafikantgruppe) ||
                hasKvG(r && (r.veg || r.key || '')) ||
                hasKvG(r && r.kortform) ||
                hasKvG(r && r.vegsystemreferanse && r.vegsystemreferanse.kortform) ||
                isGsvType(r && (r.typeVegText || r.typeVeg || r.typeveg || r.objekttype || r.navn || r.detNavn))
              );
            }

            // Opprett bare global-propertyer. Dette er trygt selv om senere script har egne funksjoner.
            w.kgsvV9Text      = w.kgsvV9Text      || text;
            w.kgsvV9Upper     = w.kgsvV9Upper     || upper;
            w.kgsvV9IsTrafG   = w.kgsvV9IsTrafG   || isTrafG;
            w.kgsvV9IsGsvType = w.kgsvV9IsGsvType || isGsvType;
            w.kgsvV9HasKvG    = w.kgsvV9HasKvG    || hasKvG;
            w.kgsvV9CatOf     = w.kgsvV9CatOf     || catOf;
            w.kgsvV9IsKvGsv   = w.kgsvV9IsKvGsv   || isKvGsv;
          })(window);
          /* === /KV-GSV v14: v9-kompatible helperfunksjoner === */
          </script>
          '''.strip()

          def patch(path: Path) -> bool:
              html = path.read_text(encoding='utf-8')
              original = html
              print(f'[INFO] Leser {path.relative_to(repo)} ({len(html)} bytes)')

              html, n_old = re.subn(
                  r'\n?\s*<script id="kgsv-v14-v9-kompat-shim">.*?</script>\s*\n?',
                  '\n',
                  html,
                  flags=re.DOTALL | re.IGNORECASE,
              )
              if n_old:
                  print(f'[INFO] Fjernet gammel v14-shim ({n_old})')

              # Viktig: legg tidlig i dokumentet, før hovedscriptet kjører loadRoadsAround.
              m = re.search(r'<head[^>]*>', html, flags=re.IGNORECASE)
              if m:
                  pos = m.end()
                  html = html[:pos] + '\n' + shim + '\n' + html[pos:]
                  print('[PATCH] La inn v9-kompatibilitet rett etter <head>')
              else:
                  m = re.search(r'<script\b[^>]*>', html, flags=re.IGNORECASE)
                  if m:
                      pos = m.start()
                      html = html[:pos] + shim + '\n' + html[pos:]
                      print('[PATCH] La inn v9-kompatibilitet før første <script>')
                  else:
                      html = shim + '\n' + html
                      print('[PATCH] La inn v9-kompatibilitet øverst')

              # Ekstra robusthet: hvis noen patchlinjer refererer til window.kgsvV12Text, gi v12/v13 navn også.
              # Ikke erstatt selve kallene; shim gjør jobben og minimerer risikoen for å ødelegge minifisert kode.

              if html != original:
                  path.write_text(html, encoding='utf-8')
                  print(f'[INFO] Skrev {path.relative_to(repo)} ({len(html)} bytes)')
                  return True
              print('[OK] Ingen endring')
              return False

          changed = sum(1 for p in targets if patch(p))
          print(f'=== Ferdig. Endrede filer: {changed} ===')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index1.html docs/index.html 2>/dev/null || true
          git diff --cached --quiet && echo "Ingen endringer å committe" || git commit -m "Fix KV-GSV v9 compatibility helpers"

      - name: Push changes
        run: |
          git push || true
