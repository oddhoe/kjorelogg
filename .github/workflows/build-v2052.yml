name: Build v2.0.52-ios

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build script
        run: |
          cd ${{ github.workspace }}
          python docs/build_v2052.py

      - name: Commit and push
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/index.html.v2051.bak || true
          if git diff --cached --quiet; then
            echo "Ingen endringer å committe"
          else
            git commit -m "Build v2.0.52-ios: error-logg, save-status, synkron flush ved fylke-bytte, v2.0.50 redigeringsliste, v2.0.51 meny-rydding"
            git push
          fi