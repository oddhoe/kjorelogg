<!doctype html>
<!-- Oddis GPS Speedometer - NVDB105/OSM lavdata v2026-05-01 v3 høyde -->
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0f17" />
  <title>GPS Speedometer Hysterese</title>

  <style>
    :root {
      --bg: #0b0f17;
      --panel: #141b27;
      --text: #f7fafc;
      --muted: #9aa7b8;
      --ok: #2ee59d;
      --warn: #ffcc00;
      --danger: #ff3030;
      --border: rgba(255,255,255,.14);
      --shadow: 0 24px 70px rgba(0,0,0,.45);
      --safeTop: env(safe-area-inset-top);
      --safeBottom: env(safe-area-inset-bottom);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #1d2a3d 0%, var(--bg) 45%, #05070b 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      position: fixed;
      inset: 0;
      padding: calc(10px + var(--safeTop)) 12px calc(10px + var(--safeBottom));
    }

    .app {
      width: min(760px, 100%);
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .02em;
      min-height: 36px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(12px);
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill.status {
      flex: 1;
    }

    .dot {
      flex: 0 0 auto;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 4px rgba(154,167,184,.12);
    }

    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(46,229,157,.13);
    }

    .dot.bad {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255,48,48,.13);
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      min-height: 0;
      overflow: hidden;
    }

    .main {
      padding: 16px 12px 14px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 12px;
      min-height: 0;
    }

    .speed-wrap {
      display: grid;
      place-items: center;
      text-align: center;
      min-height: 0;
    }

    .speedometer {
      position: relative;
      width: min(92vw, 520px, 62dvh);
      max-width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(20,27,39,.98) 0 53%, transparent 54%),
        conic-gradient(from -130deg,
          var(--arcColor, var(--ok)) 0deg,
          var(--arcColor, var(--ok)) var(--arc, 0deg),
          rgba(255,255,255,.12) var(--arc, 0deg),
          rgba(255,255,255,.12) 260deg,
          transparent 260deg 360deg);
      filter: drop-shadow(0 22px 35px rgba(0,0,0,.35));
    }

    .speedometer::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(circle at center, rgba(255,255,255,.04), transparent 62%),
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0));
    }

    .speedometer::after {
      content: "";
      position: absolute;
      inset: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.08);
    }

    .speed-content {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 5px;
    }

    .speed {
      font-size: clamp(82px, 24vw, 168px);
      font-weight: 900;
      letter-spacing: -0.075em;
      line-height: .9;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 8px 26px rgba(0,0,0,.45);
      transition: color .15s ease, transform .15s ease;
      transform: translateX(-.035em);
    }

    .speed.danger {
      color: var(--danger);
      transform: translateX(-.035em) scale(1.035);
      text-shadow:
        0 0 18px rgba(255,48,48,.35),
        0 8px 26px rgba(0,0,0,.45);
    }

    .unit {
      color: var(--muted);
      font-size: clamp(16px, 4vw, 24px);
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .roadline {
      color: rgba(255,255,255,.88);
      font-size: clamp(15px, 3.7vw, 22px);
      font-weight: 850;
      line-height: 1.2;
      min-height: 21px;
      max-width: 90vw;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: .01em;
    }

    .roadline.unknown {
      color: var(--muted);
      font-weight: 700;
    }

    .subline-wrap {
      display: grid;
      justify-items: center;
      gap: 2px;
      min-height: 40px;
      max-width: 90vw;
      padding: 0 8px;
    }

    .subline {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
      max-width: 90vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .subline.main {
      font-size: 14px;
      font-weight: 700;
    }

    .subline.meta {
      font-size: 12px;
      opacity: .92;
    }

    .sign-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: nowrap;
      min-height: 154px;
    }

    .speed-sign {
      width: 142px;
      height: 142px;
      border-radius: 50%;
      background: #fff;
      color: #111;
      border: 14px solid #df1818;
      display: grid;
      place-items: center;
      font-size: 56px;
      font-weight: 900;
      box-shadow:
        0 12px 30px rgba(0,0,0,.35),
        inset 0 0 0 2px rgba(0,0,0,.05);
      font-variant-numeric: tabular-nums;
      transition: transform .15s ease, filter .15s ease;
      flex: 0 0 auto;
    }

    .speed-sign.unknown {
      color: #666;
      border-color: #777;
      font-size: 54px;
    }

    .speed-sign.blink {
      animation: blinkSign .55s steps(2, start) infinite;
    }

    @keyframes blinkSign {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1);
        box-shadow:
          0 12px 30px rgba(0,0,0,.35),
          0 0 0 0 rgba(255,48,48,.0);
      }
      50% {
        transform: scale(1.08);
        filter: brightness(1.2);
        box-shadow:
          0 12px 30px rgba(0,0,0,.35),
          0 0 28px 8px rgba(255,48,48,.65);
      }
    }

    .info-panel {
      display: grid;
      gap: 10px;
      min-width: 220px;
      max-width: 320px;
      color: var(--muted);
      font-size: 17px;
    }

    .info-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 14px;
      padding: 13px 15px;
      border-radius: 17px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
    }

    .info-line strong {
      color: var(--text);
      font-size: 21px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .altitude-line {
      padding-top: 15px;
      padding-bottom: 15px;
    }

    .altitude-line span {
      font-size: 18px;
      font-weight: 700;
    }

    .altitude-line strong {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -.01em;
    }

    .atk-line {
      display: none;
    }

    .atk-line.show {
      display: flex;
      background: rgba(255,48,48,.16);
      border-color: rgba(255,48,48,.35);
    }

    #tapToStart {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(8px);
    }

    #tapToStart.show {
      display: grid;
    }

    .startBox {
      display: grid;
      gap: 12px;
      justify-items: center;
      text-align: center;
      max-width: 430px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 28px;
      background: rgba(255,255,255,.08);
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }

    .startTitle {
      font-size: 28px;
      font-weight: 950;
    }

    .startText {
      color: var(--muted);
      line-height: 1.35;
      font-size: 16px;
    }

    .startBtn {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 18px;
      background: #fff;
      color: #000;
      font-size: 19px;
      font-weight: 950;
    }


    /* Smartvalg: skiltet viser fartsgrense, derfor skjules fartsgrense/varsel i menyen. */
    .info-panel .info-line:nth-child(1),
    .info-panel .info-line:nth-child(2),
    #atkLine {
      display: none !important;
    }

    .info-panel {
      min-width: 225px;
      max-width: 320px;
      font-size: 17px;
      gap: 10px;
    }

    .info-line {
      padding: 13px 15px;
      border-radius: 17px;
      align-items: baseline;
    }

    .info-line strong {
      font-size: 21px;
    }

    @media (max-width: 430px) {
      body {
        padding-left: 8px;
        padding-right: 8px;
      }

      .main {
        padding-left: 8px;
        padding-right: 8px;
      }

      .sign-row {
        gap: 10px;
      }

      .speed-sign {
        width: 128px;
        height: 128px;
        border-width: 13px;
        font-size: 50px;
      }

      .info-panel {
        min-width: 160px;
        font-size: 12px;
      }

      .info-line {
        padding: 8px 9px;
      }
    }

    @media (orientation: landscape) and (max-height: 540px) {
      body {
        padding-top: calc(6px + var(--safeTop));
      }

      .app {
        grid-template-rows: 1fr;
      }

      .topbar {
        display: none;
      }

      .main {
        grid-template-columns: 1.2fr .8fr;
        grid-template-rows: 1fr;
        align-items: center;
      }

      .speedometer {
        width: min(58vh, 420px);
      }

      .sign-row {
        flex-direction: column;
        min-height: 0;
      }

      .speed-sign {
        width: 122px;
        height: 122px;
        border-width: 12px;
        font-size: 48px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="topbar">
      <div class="pill status"><span id="gpsDot" class="dot"></span><span id="gpsStatus">Starter GPS…</span></div>
      <div class="pill"><span>NVDB / OSM · låst</span></div>
    </div>

    <section class="card main">
      <div class="speed-wrap">
        <div id="speedometer" class="speedometer" aria-label="GPS hastighet">
          <div class="speed-content">
            <div id="speed" class="speed">--</div>
            <div class="unit">km/t</div>
            <div id="roadText" class="roadline unknown">Veg ukjent</div>
            <div class="subline-wrap"><div id="messageMain" class="subline main">Starter GPS…</div><div id="messageMeta" class="subline meta"></div></div>
          </div>
        </div>
      </div>

      <div class="sign-row">
        <div id="speedSign" class="speed-sign unknown" aria-label="Fartsgrense">?</div>

        <div class="info-panel">
          <div class="info-line">
            <span>GPS</span>
            <strong id="accuracyText">--</strong>
          </div>
          <div class="info-line altitude-line">
            <span>Høyde</span>
            <strong id="altitudeText">--</strong>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="tapToStart">
    <div class="startBox">
      <div class="startTitle">Start GPS</div>
      <div class="startText">
        iOS krever ofte ett trykk første gang. Etter at Safari/PWA har fått stedstilgang,
        prøver appen å starte automatisk.
      </div>
      <button id="manualStart" class="startBtn">Start</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      /*
        Norge:
          - NVDB API Les V4, vegobjekttype 105 Fartsgrense.
          - Søker med kartutsnitt rundt GPS-posisjon.
          - Velger nærmeste geometri/objekt og leser egenskap "Fartsgrense" / id 2021.

        Utenfor Norge eller ved NVDB-feil:
          - Fallback til OpenStreetMap/Overpass maxspeed + speed_camera.
      */

      const NVDB_URL = "https://nvdbapiles.atlas.vegvesen.no/vegobjekter/api/v4/vegobjekter/105";

      const OVERPASS_URLS = [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.kumi.systems/api/interpreter"
      ];

      const CFG = {
        // Hysterese/låsing mot at OSM hopper mellom sideveger i samme område.
        nvdbSearchRadiusM: 55,
        osmSpeedLimitSearchRadiusM: 45,
        speedCameraSearchRadiusM: 1600,
        cameraWarnDistanceM: 500,
        refetchDistanceM: 70,
        refetchMs: 8000,
        minSpeedForTimeRefreshKmh: 8,
        maxReasonableSpeedKmh: 250,

        // Byttefilter
        slowSpeedKmh: 12,
        stableHitsMoving: 2,
        stableHitsSlow: 4,
        keepOldOnMissingHits: 3,
        maxAcceptedRoadDistanceM: 45
      };

      const els = {
        gpsDot: document.getElementById("gpsDot"),
        gpsStatus: document.getElementById("gpsStatus"),
        speedometer: document.getElementById("speedometer"),
        speed: document.getElementById("speed"),
        roadText: document.getElementById("roadText"),
        messageMain: document.getElementById("messageMain"),
        messageMeta: document.getElementById("messageMeta"),
        speedSign: document.getElementById("speedSign"),
        accuracyText: document.getElementById("accuracyText"),
        altitudeText: document.getElementById("altitudeText"),
        tapToStart: document.getElementById("tapToStart"),
        manualStart: document.getElementById("manualStart")
      };

      let watchId = null;
      let wakeLock = null;

      let current = {
        lat: null,
        lon: null,
        speedKmh: null,
        heading: null,
        accuracy: null,
        altitude: null,
        altitudeAccuracy: null
      };

      let dataState = {
        speedLimit: null,
        speedLimitSource: "",
        roadLabel: "",
        pendingLimit: null,
        pendingRoadLabel: "",
        pendingHits: 0,
        missingHits: 0,
        cameras: [],
        lastFetchLat: null,
        lastFetchLon: null,
        lastFetchAt: 0,
        busy: false,
        endpointIndex: 0,
        requestCount: 0,
        lastRequestKind: ""
      };

      function setGpsState(state, text) {
        els.gpsDot.classList.remove("ok", "bad");
        if (state === "ok") els.gpsDot.classList.add("ok");
        if (state === "bad") els.gpsDot.classList.add("bad");
        els.gpsStatus.textContent = text;
      }

      function setMessage(text) {
        els.messageMain.textContent = String(text ?? "").trim();
        els.messageMeta.textContent = "";
      }

      function toRad(deg) { return deg * Math.PI / 180; }
      function toDeg(rad) { return rad * 180 / Math.PI; }

      function isProbablyNorway(lat, lon) {
        // Strammere enn ren bbox: hindrer NVDB-oppslag i f.eks. Östersund.
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return false;
        if (lat < 57.7 || lat > 71.4 || lon < 4.0 || lon > 31.5) return false;

        let eastMax;
        if (lat < 59.0) eastMax = 11.4;
        else if (lat < 61.0) eastMax = 12.6;
        else if (lat < 63.8) eastMax = 13.4;
        else if (lat < 65.6) eastMax = 14.8;
        else if (lat < 67.4) eastMax = 17.6;
        else if (lat < 68.9) eastMax = 21.8;
        else if (lat < 69.7) eastMax = 26.6;
        else eastMax = 31.5;

        return lon <= eastMax;
      }

      function distanceM(aLat, aLon, bLat, bLon) {
        const R = 6371000;
        const dLat = toRad(bLat - aLat);
        const dLon = toRad(bLon - aLon);
        const lat1 = toRad(aLat);
        const lat2 = toRad(bLat);
        const s =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
      }

      function bearingDeg(aLat, aLon, bLat, bLon) {
        const lat1 = toRad(aLat);
        const lat2 = toRad(bLat);
        const dLon = toRad(bLon - aLon);
        const y = Math.sin(dLon) * Math.cos(lat2);
        const x =
          Math.cos(lat1) * Math.sin(lat2) -
          Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
        return (toDeg(Math.atan2(y, x)) + 360) % 360;
      }

      function angleDiffDeg(a, b) {
        const diff = Math.abs(a - b) % 360;
        return diff > 180 ? 360 - diff : diff;
      }

      function bboxAround(lat, lon, radiusM) {
        const dLat = radiusM / 111320;
        const dLon = radiusM / ((111320 * Math.cos(toRad(lat))) || 1);
        return {
          south: lat - dLat,
          west: lon - dLon,
          north: lat + dLat,
          east: lon + dLon
        };
      }

      function parseSpeedValue(value) {
        if (value === null || value === undefined) return null;
        const raw = String(value).trim().toLowerCase();

        if (
          raw === "none" ||
          raw === "signals" ||
          raw === "variable" ||
          raw === "walk" ||
          raw === "implicit"
        ) {
          return null;
        }

        const firstNumber = raw.match(/(\d+(?:[.,]\d+)?)/);
        if (!firstNumber) return null;

        let num = Number(firstNumber[1].replace(",", "."));
        if (!Number.isFinite(num)) return null;

        if (raw.includes("mph")) num = num * 1.609344;

        num = Math.round(num);
        if (num < 5 || num > 140) return null;

        return num;
      }

      function getNested(obj, path) {
        return path.split(".").reduce((acc, key) => acc && acc[key], obj);
      }
      function normalizeRoadRef(text) {
        if (!text) return "";
        let s = String(text).trim();
        if (!s) return "";
        s = s.replace(/\s+/g, " ");

        const ref = s.match(/\b(EV\s?\d+|RV\s?\d+|FV\s?\d+|KV\s?\d+|PV\s?\d+|E\s?\d+|Rv\s?\d+|Fv\s?\d+|Kv\s?\d+|Pv\s?\d+)\b/i);
        if (ref) {
          const r = ref[1];
          return r
            .replace(/^EV\s*/i, "E")
            .replace(/^E\s*/i, "E")
            .replace(/^RV\s*/i, "Rv ")
            .replace(/^Rv\s*/i, "Rv ")
            .replace(/^FV\s*/i, "Fv ")
            .replace(/^Fv\s*/i, "Fv ")
            .replace(/^KV\s*/i, "Kv ")
            .replace(/^Kv\s*/i, "Kv ")
            .replace(/^PV\s*/i, "Pv ")
            .replace(/^Pv\s*/i, "Pv ");
        }
        return s;
      }

      function roadDisplayFromOsmTags(tags) {
        const ref = normalizeRoadRef(tags.ref || tags.official_ref || tags["destination:ref"] || "");
        if (ref) return ref;
        return String(tags.name || tags["name:sv"] || tags["name:no"] || "").trim();
      }

      function extractRoadRefFromKortform(kortform) {
        return normalizeRoadRef(kortform || "");
      }

      function buildRoadLabelFromVegsystemRef(vsr) {
        if (!vsr || typeof vsr !== "object") return "";

        const direct = extractRoadRefFromKortform(vsr.kortform || vsr.vegsystemreferanse?.kortform);
        if (direct) return direct;

        const vegsystem = vsr.vegsystem || vsr.vegsystemreferanse?.vegsystem || {};
        const nummer = vegsystem.nummer ?? vsr.nummer;
        let kategori = vegsystem.vegkategori ?? vsr.vegkategori ?? "";
        if (!nummer) return "";

        kategori = String(kategori).toUpperCase();
        if (kategori === "E") return `E${nummer}`;
        if (kategori === "R") return `Rv ${nummer}`;
        if (kategori === "F") return `Fv ${nummer}`;
        if (kategori === "K") return `Kv ${nummer}`;
        if (kategori === "P") return `Pv ${nummer}`;
        return String(nummer);
      }

      function extractNvdbRoadLabel(obj) {
        const candidates = [
          getNested(obj, "lokasjon.vegsystemreferanser"),
          getNested(obj, "vegsystemreferanser"),
          getNested(obj, "lokasjon.vegsegmenter"),
          getNested(obj, "vegsegmenter"),
          getNested(obj, "lokasjon.stedfestinger"),
          getNested(obj, "stedfestinger")
        ];

        for (const candidate of candidates) {
          if (!candidate) continue;
          const arr = Array.isArray(candidate) ? candidate : [candidate];
          for (const item of arr) {
            const label = buildRoadLabelFromVegsystemRef(item);
            if (label) return label;
          }
        }

        let found = "";
        function walk(value, keyHint = "") {
          if (found || value === null || value === undefined) return;
          if (typeof value === "string") {
            if (/kortform|vegsystem|vegref/i.test(keyHint) || /\b(EV|RV|FV|KV|PV|E|Rv|Fv|Kv|Pv)\s?\d+\b/i.test(value)) {
              const r = normalizeRoadRef(value);
              if (r) found = r;
            }
            return;
          }
          if (typeof value !== "object") return;
          if (Array.isArray(value)) {
            for (const item of value) walk(item, keyHint);
            return;
          }
          const direct = buildRoadLabelFromVegsystemRef(value);
          if (direct) { found = direct; return; }
          for (const [k, child] of Object.entries(value)) walk(child, k);
        }
        walk(obj);
        return found;
      }

      function applyCandidateLimit(candidate) {
        const speed = Number.isFinite(current.speedKmh) ? current.speedKmh : 0;

        if (!candidate || !candidate.limit) {
          dataState.missingHits += 1;
          if (dataState.speedLimit && dataState.missingHits < CFG.keepOldOnMissingHits) {
            return;
          }
          dataState.speedLimit = null;
          dataState.roadLabel = "";
          dataState.pendingLimit = null;
          dataState.pendingRoadLabel = "";
          dataState.pendingHits = 0;
          return;
        }

        dataState.missingHits = 0;
        const roadLabel = candidate.roadLabel || "";

        if (!dataState.speedLimit) {
          dataState.speedLimit = candidate.limit;
          dataState.roadLabel = roadLabel;
          dataState.pendingLimit = null;
          dataState.pendingRoadLabel = "";
          dataState.pendingHits = 0;
          return;
        }

        if (candidate.limit === dataState.speedLimit && roadLabel === dataState.roadLabel) {
          dataState.pendingLimit = null;
          dataState.pendingRoadLabel = "";
          dataState.pendingHits = 0;
          return;
        }

        // Ved lav fart/stillstand skal ikke OSM/NVDB få hoppe fritt mellom sideveger.
        const needed = speed < CFG.slowSpeedKmh ? CFG.stableHitsSlow : CFG.stableHitsMoving;

        if (dataState.pendingLimit === candidate.limit && dataState.pendingRoadLabel === roadLabel) {
          dataState.pendingHits += 1;
        } else {
          dataState.pendingLimit = candidate.limit;
          dataState.pendingRoadLabel = roadLabel;
          dataState.pendingHits = 1;
        }

        if (dataState.pendingHits >= needed) {
          dataState.speedLimit = candidate.limit;
          dataState.roadLabel = roadLabel;
          dataState.pendingLimit = null;
          dataState.pendingRoadLabel = "";
          dataState.pendingHits = 0;
        }
      }


      function extractNvdbSpeedLimit(obj) {
        const candidates = [];

        function walk(value) {
          if (!value || typeof value !== "object") return;

          if (Array.isArray(value)) {
            for (const item of value) walk(item);
            return;
          }

          const id = value.id ?? value.egenskapstypeid ?? value.egenskapstype?.id;
          const navn = String(value.navn ?? value.egenskapstype?.navn ?? "").toLowerCase();

          const looksLikeSpeed =
            id === 2021 ||
            navn === "fartsgrense" ||
            navn.includes("fartsgrense") ||
            navn.includes("hastighet");

          if (looksLikeSpeed) {
            const vals = [
              value.verdi,
              value.enum_verdi,
              value.kortnavn,
              value.visningsnavn,
              value.tekst,
              value.value
            ];

            for (const v of vals) {
              const parsed = parseSpeedValue(v);
              if (parsed) candidates.push(parsed);
            }

            if (value.verdi && typeof value.verdi === "object") {
              for (const v of Object.values(value.verdi)) {
                const parsed = parseSpeedValue(v);
                if (parsed) candidates.push(parsed);
              }
            }
          }

          for (const child of Object.values(value)) {
            if (child && typeof child === "object") walk(child);
          }
        }

        walk(obj);

        return candidates.length ? candidates[0] : null;
      }

      function extractCoordinatesFromWkt(wkt) {
        if (!wkt || typeof wkt !== "string") return [];

        const nums = wkt.match(/-?\d+(?:\.\d+)?\s+-?\d+(?:\.\d+)?/g);
        if (!nums) return [];

        const coords = [];

        for (const pair of nums) {
          const [a, b] = pair.trim().split(/\s+/).map(Number);
          if (!Number.isFinite(a) || !Number.isFinite(b)) continue;

          // SRID 4326 WKT er normalt lon lat.
          if (Math.abs(a) <= 180 && Math.abs(b) <= 90) {
            coords.push([b, a]); // lat, lon
          }
        }

        return coords;
      }

      function extractNvdbCoords(obj) {
        const coords = [];
        const possibleWkts = [
          getNested(obj, "geometri.wkt"),
          getNested(obj, "geometri.egengeometri"),
          getNested(obj, "geometri.vegnettsgeometri"),
          getNested(obj, "lokasjon.geometri.wkt")
        ].filter(Boolean);

        for (const wkt of possibleWkts) {
          coords.push(...extractCoordinatesFromWkt(wkt));
        }

        // Tolerant deep scan for WKT strings.
        function walk(value) {
          if (!value || typeof value !== "object") return;

          if (Array.isArray(value)) {
            for (const item of value) walk(item);
            return;
          }

          for (const [key, child] of Object.entries(value)) {
            if (typeof child === "string" && key.toLowerCase().includes("wkt")) {
              coords.push(...extractCoordinatesFromWkt(child));
            } else if (child && typeof child === "object") {
              walk(child);
            }
          }
        }

        walk(obj);
        return coords;
      }

      function metersXY(lat, lon, originLat, originLon) {
        return {
          x: (lon - originLon) * 111320 * Math.cos(toRad(originLat)),
          y: (lat - originLat) * 111320
        };
      }

      function pointToSegmentDistanceM(pLat, pLon, aLat, aLon, bLat, bLon) {
        const a = metersXY(aLat, aLon, pLat, pLon);
        const b = metersXY(bLat, bLon, pLat, pLon);
        const vx = b.x - a.x;
        const vy = b.y - a.y;
        const len2 = vx * vx + vy * vy;

        if (len2 === 0) {
          return Math.sqrt(a.x * a.x + a.y * a.y);
        }

        const t = Math.max(0, Math.min(1, (-(a.x * vx + a.y * vy)) / len2));
        const px = a.x + t * vx;
        const py = a.y + t * vy;
        return Math.sqrt(px * px + py * py);
      }

      function objectDistanceToGps(obj, lat, lon) {
        const coords = extractNvdbCoords(obj);

        if (!coords.length) return 9999;

        let best = Infinity;
        let bestBearing = null;

        if (coords.length === 1) {
          best = distanceM(lat, lon, coords[0][0], coords[0][1]);
        } else {
          for (let i = 0; i < coords.length - 1; i++) {
            const a = coords[i];
            const b = coords[i + 1];
            const d = pointToSegmentDistanceM(lat, lon, a[0], a[1], b[0], b[1]);
            if (d < best) {
              best = d;
              bestBearing = bearingDeg(a[0], a[1], b[0], b[1]);
            }
          }
        }

        // Reduser feil treff på tilstøtende veger ved å straffe feil retning.
        if (Number.isFinite(current.heading) && Number.isFinite(bestBearing) && current.speedKmh > 8) {
          const diff1 = angleDiffDeg(current.heading, bestBearing);
          const diff2 = angleDiffDeg(current.heading, (bestBearing + 180) % 360);
          const diff = Math.min(diff1, diff2);
          if (diff > 70) best += 120;
          else if (diff > 35) best += 35;
        }

        return best;
      }

      async function fetchNvdbSpeedLimit(lat, lon) {
        const box = bboxAround(lat, lon, CFG.nvdbSearchRadiusM);
        const params = new URLSearchParams({
          srid: "4326",
          kartutsnitt: `${box.west},${box.south},${box.east},${box.north}`,
          inkluder: "egenskaper,geometri,lokasjon",
          inkluderAntall: "false",
          antall: "50"
        });

        const res = await fetch(`${NVDB_URL}?${params.toString()}`, {
          headers: {
            "Accept": "application/json",
            "X-Client": "oddis-gps-speedometer/1.0"
          }
        });

        if (!res.ok) throw new Error("NVDB HTTP " + res.status);

        const json = await res.json();

        const objects =
          Array.isArray(json.objekter) ? json.objekter :
          Array.isArray(json.vegobjekter) ? json.vegobjekter :
          Array.isArray(json) ? json :
          [];

        let best = null;

        for (const obj of objects) {
          const limit = extractNvdbSpeedLimit(obj);
          if (!limit) continue;

          const dist = objectDistanceToGps(obj, lat, lon);
          if (dist > CFG.maxAcceptedRoadDistanceM) continue;

          if (!best || dist < best.dist) {
            best = { limit, dist, roadLabel: extractNvdbRoadLabel(obj) };
          }
        }

        return best || null;
      }

      function buildOverpassQuery(lat, lon, includeRoads) {
        const road = bboxAround(lat, lon, CFG.osmSpeedLimitSearchRadiusM);
        const cam = bboxAround(lat, lon, CFG.speedCameraSearchRadiusM);

        const roadPart = includeRoads
          ? `way["highway"]["maxspeed"](${road.south},${road.west},${road.north},${road.east});`
          : "";

        return `
[out:json][timeout:8];
(
  ${roadPart}
  node["highway"="speed_camera"](${cam.south},${cam.west},${cam.north},${cam.east});
  node["enforcement"~"maxspeed|average_speed"](${cam.south},${cam.west},${cam.north},${cam.east});
  relation["type"="enforcement"]["enforcement"~"maxspeed|average_speed"](${cam.south},${cam.west},${cam.north},${cam.east});
);
out geom tags center;
        `.trim();
      }

      async function fetchOverpass(lat, lon, includeRoads) {
        const query = buildOverpassQuery(lat, lon, includeRoads);

        for (let attempt = 0; attempt < OVERPASS_URLS.length; attempt++) {
          const idx = (dataState.endpointIndex + attempt) % OVERPASS_URLS.length;
          const url = OVERPASS_URLS[idx];

          try {
            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
              body: "data=" + encodeURIComponent(query)
            });

            if (!res.ok) throw new Error("HTTP " + res.status);

            dataState.endpointIndex = idx;
            return await res.json();
          } catch (err) {
            if (attempt === OVERPASS_URLS.length - 1) throw err;
          }
        }
      }

      function processOsm(data, lat, lon, allowSpeedLimit) {
        const elements = Array.isArray(data.elements) ? data.elements : [];

        let bestCandidate = null;
        let bestDist = Infinity;
        const cameras = [];

        for (const el of elements) {
          const tags = el.tags || {};

          if (allowSpeedLimit && el.type === "way" && tags.maxspeed) {
            const limit = parseSpeedValue(tags.maxspeed);
            if (!limit) continue;

            const geom = Array.isArray(el.geometry) ? el.geometry : [];
            let d = Infinity;

            if (geom.length >= 2) {
              for (let i = 0; i < geom.length - 1; i++) {
                const a = geom[i];
                const b = geom[i + 1];
                if (!Number.isFinite(a.lat) || !Number.isFinite(a.lon) || !Number.isFinite(b.lat) || !Number.isFinite(b.lon)) continue;
                const segD = pointToSegmentDistanceM(lat, lon, a.lat, a.lon, b.lat, b.lon);
                if (segD < d) d = segD;
              }
            } else if (el.center) {
              d = distanceM(lat, lon, el.center.lat, el.center.lon);
            }

            if (d < bestDist && d <= CFG.maxAcceptedRoadDistanceM) {
              bestDist = d;
              bestCandidate = {
                limit,
                dist: d,
                roadLabel: roadDisplayFromOsmTags(tags)
              };
            }
          }

          const isSpeedCamera =
            tags.highway === "speed_camera" ||
            tags.enforcement === "maxspeed" ||
            tags.enforcement === "average_speed";

          if (isSpeedCamera) {
            const cLat = Number.isFinite(el.lat) ? el.lat : el.center?.lat;
            const cLon = Number.isFinite(el.lon) ? el.lon : el.center?.lon;

            if (Number.isFinite(cLat) && Number.isFinite(cLon)) {
              cameras.push({
                lat: cLat,
                lon: cLon,
                maxspeed: parseSpeedValue(tags.maxspeed),
                type: tags.enforcement || tags.highway || "speed_camera"
              });
            }
          }
        }

        return { candidate: bestCandidate, cameras };
      }

      function shouldFetchData(lat, lon) {
        if (dataState.busy) return false;
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return false;
        if (!dataState.lastFetchAt) return true;

        const age = Date.now() - dataState.lastFetchAt;
        const moved = distanceM(lat, lon, dataState.lastFetchLat, dataState.lastFetchLon);
        const speed = Number.isFinite(current.speedKmh) ? current.speedKmh : 0;

        // Lav databruk:
        // 1) Hent alltid ved nok forflytning.
        if (moved > CFG.refetchDistanceM) return true;

        // 2) Tidsbasert refresh bare når bilen faktisk beveger seg.
        //    Hindrer API-kall hvert 30. sekund når du står parkert/stille.
        if (speed >= CFG.minSpeedForTimeRefreshKmh && age > CFG.refetchMs) return true;

        return false;
      }

      async function maybeFetchData() {
        const { lat, lon, accuracy } = current;

        if (!shouldFetchData(lat, lon)) return;

        if (Number.isFinite(accuracy) && accuracy > 80) {
          setMessage("Venter på bedre GPS før fartsgrense hentes…");
          return;
        }

        dataState.busy = true;
        dataState.requestCount += 1;
        dataState.lastFetchAt = Date.now();
        dataState.lastFetchLat = lat;
        dataState.lastFetchLon = lon;

        const inNorway = isProbablyNorway(lat, lon);

        try {
          if (inNorway) {
            dataState.lastRequestKind = "NVDB";
            setMessage("Henter fartsgrense fra NVDB…");
            const candidate = await fetchNvdbSpeedLimit(lat, lon);

            if (candidate) {
              applyCandidateLimit(candidate);
              dataState.speedLimitSource = "NVDB 105";

              // OSM brukes bare for ATK når NVDB faktisk ga norsk fartsgrense.
              try {
                const osmData = await fetchOverpass(lat, lon, false);
                const osm = processOsm(osmData, lat, lon, false);
                dataState.cameras = osm.cameras;
              } catch (_) {
                dataState.cameras = [];
              }
            } else {
              // Viktig: grov Norge-boks treffer også deler av Sverige/Finland.
              // Ved tomt NVDB-treff prøver vi OSM maxspeed før vi gir opp.
              dataState.lastRequestKind = "OSM fallback";
              setMessage("NVDB uten treff – prøver OSM…");
              const osmData = await fetchOverpass(lat, lon, true);
              const osm = processOsm(osmData, lat, lon, true);
              applyCandidateLimit(osm.candidate);
              dataState.speedLimitSource = osm.candidate ? "OSM fallback" : "OSM: ikke treff";
              dataState.cameras = osm.cameras;
            }
          } else {
            dataState.lastRequestKind = "OSM";
            setMessage("Henter fartsgrense fra OSM…");
            const osmData = await fetchOverpass(lat, lon, true);
            const osm = processOsm(osmData, lat, lon, true);
            applyCandidateLimit(osm.candidate);
            dataState.speedLimitSource = osm.candidate ? "OSM maxspeed" : "OSM: ikke treff";
            dataState.cameras = osm.cameras;
          }

          render();
        } catch (err) {
          // Hvis NVDB feiler i Norge, prøv OSM som nødløsning.
          if (inNorway) {
            try {
              setMessage("NVDB feilet – prøver OSM…");
              const osmData = await fetchOverpass(lat, lon, true);
              const osm = processOsm(osmData, lat, lon, true);
              applyCandidateLimit(osm.candidate);
              dataState.speedLimitSource = osm.candidate ? "OSM fallback" : "ikke treff";
              dataState.cameras = osm.cameras;
            } catch (_) {
              applyCandidateLimit(null);
              dataState.speedLimitSource = "oppslag feilet";
              dataState.cameras = [];
            }
          } else {
            applyCandidateLimit(null);
            dataState.speedLimitSource = "oppslag feilet";
            dataState.cameras = [];
          }

          render();
        } finally {
          dataState.busy = false;
        }
      }

      function nearestRelevantCamera() {
        const { lat, lon, heading } = current;
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;

        let best = null;

        for (const cam of dataState.cameras) {
          const d = distanceM(lat, lon, cam.lat, cam.lon);
          if (d > CFG.cameraWarnDistanceM) continue;

          let ahead = true;
          if (Number.isFinite(heading) && current.speedKmh > 8) {
            const b = bearingDeg(lat, lon, cam.lat, cam.lon);
            ahead = angleDiffDeg(heading, b) <= 75;
          }

          if (!ahead) continue;

          if (!best || d < best.distanceM) {
            best = { ...cam, distanceM: d };
          }
        }

        return best;
      }

      function updateGauge(speed, limit, over) {
        const hasSpeed = Number.isFinite(speed);
        const arcSpeed = hasSpeed ? Math.max(0, Math.min(140, speed)) : 0;
        const arcDeg = (arcSpeed / 140) * 260;

        let arcColor = "var(--ok)";
        if (limit && speed > limit) arcColor = "var(--warn)";
        if (over) arcColor = "var(--danger)";

        els.speedometer.style.setProperty("--arc", `${arcDeg}deg`);
        els.speedometer.style.setProperty("--arcColor", arcColor);
      }

      function render() {
        const speed = Number.isFinite(current.speedKmh) ? current.speedKmh : null;
        const limit = dataState.speedLimit;
        const camera = nearestRelevantCamera();

        els.speed.textContent = speed === null ? "--" : String(Math.round(speed));

        if (limit) {
          els.speedSign.textContent = String(limit);
          els.speedSign.classList.remove("unknown");
        } else {
          els.speedSign.textContent = "?";
          els.speedSign.classList.add("unknown");
        }

        const over = speed !== null && limit && speed > limit + 5;
        els.speed.classList.toggle("danger", Boolean(over));
        els.speedSign.classList.toggle("blink", Boolean(over));
        updateGauge(speed, limit, over);

        if (dataState.roadLabel) {
          els.roadText.textContent = dataState.roadLabel;
          els.roadText.classList.remove("unknown");
        } else {
          els.roadText.textContent = "Veg ukjent";
          els.roadText.classList.add("unknown");
        }

        els.accuracyText.textContent = Number.isFinite(current.accuracy)
          ? `±${Math.round(current.accuracy)} m`
          : "--";

        if (Number.isFinite(current.altitude)) {
          const alt = `${Math.round(current.altitude)} moh`;
          const acc = Number.isFinite(current.altitudeAccuracy)
            ? ` ±${Math.round(current.altitudeAccuracy)} m`
            : "";
          els.altitudeText.textContent = alt + acc;
        } else {
          els.altitudeText.textContent = "--";
        }

        if (!dataState.busy) {
          if (speed === null) {
            setMessage("Venter på GPS-hastighet");
          } else if (over) {
            setMessage(`Over grense med ${Math.round(speed - limit)} km/t`);
          } else if (limit && speed > limit) {
            setMessage("Over fartsgrense");
          } else if (limit) {
            setMessage("Innenfor fartsgrense");
          } else {
            setMessage(dataState.busy ? "Henter fartsgrense" : "Fartsgrense ukjent");
          }
        }
      }

      function onPosition(pos) {
        const c = pos.coords;

        current.lat = c.latitude;
        current.lon = c.longitude;
        current.accuracy = c.accuracy;
        current.altitude = Number.isFinite(c.altitude) ? c.altitude : null;
        current.altitudeAccuracy = Number.isFinite(c.altitudeAccuracy) ? c.altitudeAccuracy : null;

        const mps = c.speed;
        const kmh = Number.isFinite(mps) && mps >= 0 ? mps * 3.6 : 0;

        current.speedKmh =
          kmh >= 0 && kmh < CFG.maxReasonableSpeedKmh
            ? kmh
            : current.speedKmh;

        current.heading =
          Number.isFinite(c.heading) && c.heading >= 0
            ? c.heading
            : current.heading;

        els.tapToStart.classList.remove("show");
        setGpsState("ok", "GPS aktiv");
        render();
        maybeFetchData();
      }

      function onGeoError(err) {
        let msg = "GPS-feil";
        if (err.code === 1) msg = "GPS nektet – gi stedstilgang i Safari";
        if (err.code === 2) msg = "GPS utilgjengelig";
        if (err.code === 3) msg = "GPS timeout";

        setGpsState("bad", msg);
        setMessage(msg);
        els.tapToStart.classList.add("show");
      }

      async function requestWakeLock() {
        try {
          if ("wakeLock" in navigator && !wakeLock) {
            wakeLock = await navigator.wakeLock.request("screen");
          }
        } catch (_) {
          wakeLock = null;
        }
      }

      function startGps() {
        if (!("geolocation" in navigator)) {
          setGpsState("bad", "GPS mangler");
          setMessage("Denne nettleseren støtter ikke GPS");
          els.tapToStart.classList.add("show");
          return;
        }

        requestWakeLock();

        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }

        setGpsState("", "Starter GPS…");
        setMessage("Henter GPS-signal…");

        watchId = navigator.geolocation.watchPosition(
          onPosition,
          onGeoError,
          {
            enableHighAccuracy: true,
            maximumAge: 500,
            timeout: 12000
          }
        );
      }

      function tryAutoStart() {
        startGps();

        window.setTimeout(() => {
          if (!Number.isFinite(current.lat)) {
            els.tapToStart.classList.add("show");
          }
        }, 1800);
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) return;
        requestWakeLock();
        if (watchId !== null) startGps();
      });

      els.manualStart.addEventListener("click", () => {
        els.tapToStart.classList.remove("show");
        startGps();
      });

      window.addEventListener("load", tryAutoStart);
      window.addEventListener("orientationchange", () => window.scrollTo(0, 0));

      document.addEventListener("touchmove", (e) => {
        e.preventDefault();
      }, { passive: false });

      render();
    })();
  </script>
</body>
</html>
