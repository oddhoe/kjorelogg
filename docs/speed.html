<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#05070b" />
  <title>GPS Fart</title>
  <style>
    :root {
      --bg: #05070b;
      --text: #ffffff;
      --muted: rgba(255,255,255,.62);
      --danger: #ff2020;
      --ok: #ffffff;
      --safeTop: env(safe-area-inset-top);
      --safeBottom: env(safe-area-inset-bottom);
      --signRed: #e11919;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; min-height: 100%;
      overflow: hidden; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      user-select: none; touch-action: manipulation;
    }
    body { position: fixed; inset: 0; }
    #app {
      position: fixed; inset: 0; width: 100vw; height: 100dvh; min-height: 100vh;
      display: grid; grid-template-rows: 1fr auto;
      padding: calc(10px + var(--safeTop)) 14px calc(10px + var(--safeBottom));
      background: radial-gradient(circle at 50% 20%, rgba(35,45,60,.9), transparent 42%),
                  linear-gradient(180deg, #080d14 0%, #020307 100%);
    }
    .main { display: grid; place-items: center; min-height: 0; }
    .speedBlock { display: grid; justify-items: center; align-content: center; gap: 8px; width: 100%; }
    #speed {
      font-size: clamp(118px, 42vw, 245px); font-weight: 950;
      letter-spacing: -0.09em; line-height: .82; font-variant-numeric: tabular-nums;
      color: var(--ok); text-shadow: 0 16px 42px rgba(0,0,0,.6);
      transform: translateX(-.035em);
    }
    #speed.danger {
      color: var(--danger);
      text-shadow: 0 0 18px rgba(255,32,32,.42), 0 16px 42px rgba(0,0,0,.6);
    }
    .unit {
      font-size: clamp(19px, 5vw, 30px); font-weight: 850;
      letter-spacing: .22em; color: var(--muted); text-transform: uppercase;
    }
    .bottom { display: grid; justify-items: center; gap: 10px; padding-bottom: 4px; }
    .limitRow {
      display: flex; align-items: center; justify-content: center;
      gap: clamp(14px, 5vw, 34px); width: 100%;
    }
    #speedSign {
      width: clamp(118px, 34vw, 170px); height: clamp(118px, 34vw, 170px);
      border-radius: 50%; background: #fff; color: #111;
      border: clamp(11px, 3vw, 16px) solid var(--signRed);
      display: grid; place-items: center;
      font-size: clamp(46px, 14vw, 72px); font-weight: 950;
      font-variant-numeric: tabular-nums; box-shadow: 0 16px 38px rgba(0,0,0,.52);
    }
    #speedSign.unknown {
      color: #555; border-color: #777; font-size: clamp(38px, 12vw, 62px);
    }
    #speedSign.blink { animation: blink .48s steps(2, start) infinite; }
    @keyframes blink {
      0%, 100% { transform: scale(1); filter: brightness(1); box-shadow: 0 16px 38px rgba(0,0,0,.52); }
      50% { transform: scale(1.11); filter: brightness(1.2); box-shadow: 0 16px 38px rgba(0,0,0,.52), 0 0 38px 14px rgba(255,32,32,.72); }
    }
    .atk {
      display: none; min-width: clamp(118px, 34vw, 170px); min-height: clamp(84px, 22vw, 120px);
      padding: 10px 12px; border: 4px solid rgba(255,255,255,.86); border-radius: 24px;
      align-content: center; justify-items: center; background: rgba(255,255,255,.08);
      box-shadow: 0 16px 38px rgba(0,0,0,.38); font-weight: 950; text-align: center;
    }
    .atk.show { display: grid; }
    .atkIcon { font-size: clamp(32px, 10vw, 52px); line-height: 1; }
    .atkText { font-size: clamp(18px, 5vw, 26px); letter-spacing: .04em; }
    .status {
      width: 100%; max-width: 520px; min-height: 26px; text-align: center;
      color: var(--muted); font-size: clamp(12px, 3.4vw, 16px); line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #tapToStart {
      position: fixed; inset: 0; z-index: 10; display: none; place-items: center;
      padding: 22px; background: rgba(0,0,0,.78); backdrop-filter: blur(8px);
    }
    #tapToStart.show { display: grid; }
    .startBox {
      display: grid; gap: 12px; justify-items: center; text-align: center; max-width: 430px;
      padding: 24px; border: 1px solid rgba(255,255,255,.22); border-radius: 28px;
      background: rgba(255,255,255,.08); box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }
    .startTitle { font-size: 28px; font-weight: 950; }
    .startText { color: var(--muted); line-height: 1.35; font-size: 16px; }
    .startBtn {
      width: 100%; min-height: 58px; border: 0; border-radius: 18px;
      background: #fff; color: #000; font-size: 19px; font-weight: 950;
    }
    @media (orientation: landscape) {
      #app { grid-template-rows: 1fr; grid-template-columns: 1fr auto; gap: 10px; }
      .bottom { align-content: center; width: min(40vw, 300px); }
      .limitRow { flex-direction: column; }
      #speed { font-size: clamp(98px, 34vh, 190px); }
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="main" aria-label="GPS hastighet">
      <div class="speedBlock">
        <div id="speed">--</div>
        <div class="unit">km/t</div>
      </div>
    </section>
    <section class="bottom" aria-label="Fartsgrense og ATK">
      <div class="limitRow">
        <div id="speedSign" class="unknown">?</div>
        <div id="atkBox" class="atk">
          <div class="atkIcon">📷</div>
          <div class="atkText" id="atkText">ATK</div>
        </div>
      </div>
      <div id="status" class="status">Starter GPS…</div>
    </section>
  </main>
  <div id="tapToStart">
    <div class="startBox">
      <div class="startTitle">Start GPS</div>
      <div class="startText">
        iOS krever ofte ett trykk før GPS kan starte. Etter at stedstilgang er gitt,
        prøver appen å starte automatisk neste gang.
      </div>
      <button id="manualStart" class="startBtn">Start</button>
    </div>
  </div>
  <script>
    (() => {
      "use strict";

      const OVERPASS_URLS = [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.kumi.systems/api/interpreter"
      ];

      const CFG = {
        speedLimitSearchRadiusM: 85,
        speedCameraSearchRadiusM: 1600,
        cameraWarnDistanceM: 500,
        refetchDistanceM: 350,
        refetchMs: 25000,
        maxReasonableSpeedKmh: 250
      };

      const els = {
        speed: document.getElementById("speed"),
        speedSign: document.getElementById("speedSign"),
        atkBox: document.getElementById("atkBox"),
        atkText: document.getElementById("atkText"),
        status: document.getElementById("status"),
        tapToStart: document.getElementById("tapToStart"),
        manualStart: document.getElementById("manualStart")
      };

      let watchId = null;
      let wakeLock = null;

      let current = {
        lat: null,
        lon: null,
        speedKmh: null,
        heading: null,
        accuracy: null
      };

      let osm = {
        speedLimit: null,
        source: "",
        cameras: [],
        lastFetchLat: null,
        lastFetchLon: null,
        lastFetchAt: 0,
        busy: false,
        endpointIndex: 0
      };

      function setStatus(text) {
        els.status.textContent = text;
      }

      function toRad(deg) { return deg * Math.PI / 180; }
      function toDeg(rad) { return rad * 180 / Math.PI; }

      function distanceM(aLat, aLon, bLat, bLon) {
        const R = 6371000;
        const dLat = toRad(bLat - aLat);
        const dLon = toRad(bLon - aLon);
        const lat1 = toRad(aLat);
        const lat2 = toRad(bLat);
        const s =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
      }

      function bearingDeg(aLat, aLon, bLat, bLon) {
        const lat1 = toRad(aLat);
        const lat2 = toRad(bLat);
        const dLon = toRad(bLon - aLon);
        const y = Math.sin(dLon) * Math.cos(lat2);
        const x =
          Math.cos(lat1) * Math.sin(lat2) -
          Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
        return (toDeg(Math.atan2(y, x)) + 360) % 360;
      }

      function angleDiffDeg(a, b) {
        const diff = Math.abs(a - b) % 360;
        return diff > 180 ? 360 - diff : diff;
      }

      function parseMaxspeed(value) {
        if (!value) return null;
        const raw = String(value).trim().toLowerCase();

        if (raw === "none" || raw === "signals" || raw === "variable" || raw === "walk" || raw === "implicit") {
          return null;
        }

        const firstNumber = raw.match(/(\d+(?:[.,]\d+)?)/);
        if (!firstNumber) return null;

        let num = Number(firstNumber[1].replace(",", "."));
        if (!Number.isFinite(num)) return null;

        if (raw.includes("mph")) num = num * 1.609344;

        num = Math.round(num);
        if (num < 5 || num > 140) return null;

        return num;
      }

      function bboxAround(lat, lon, radiusM) {
        const dLat = radiusM / 111320;
        const dLon = radiusM / ((111320 * Math.cos(toRad(lat))) || 1);
        return {
          south: lat - dLat,
          west: lon - dLon,
          north: lat + dLat,
          east: lon + dLon
        };
      }

      function buildOverpassQuery(lat, lon) {
        const road = bboxAround(lat, lon, CFG.speedLimitSearchRadiusM);
        const cam = bboxAround(lat, lon, CFG.speedCameraSearchRadiusM);

        return `
[out:json][timeout:8];
(
  way["highway"]["maxspeed"](${road.south},${road.west},${road.north},${road.east});
  node["highway"="speed_camera"](${cam.south},${cam.west},${cam.north},${cam.east});
  node["enforcement"~"maxspeed|average_speed"](${cam.south},${cam.west},${cam.north},${cam.east});
  relation["type"="enforcement"]["enforcement"~"maxspeed|average_speed"](${cam.south},${cam.west},${cam.north},${cam.east});
);
out center tags;
>;
out skel qt;
        `.trim();
      }

      async function fetchOverpass(lat, lon) {
        const query = buildOverpassQuery(lat, lon);

        for (let attempt = 0; attempt < OVERPASS_URLS.length; attempt++) {
          const idx = (osm.endpointIndex + attempt) % OVERPASS_URLS.length;
          const url = OVERPASS_URLS[idx];

          try {
            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
              body: "data=" + encodeURIComponent(query)
            });

            if (!res.ok) throw new Error("HTTP " + res.status);

            osm.endpointIndex = idx;
            return await res.json();
          } catch (err) {
            if (attempt === OVERPASS_URLS.length - 1) throw err;
          }
        }
      }

      function processOsm(data, lat, lon) {
        const elements = Array.isArray(data.elements) ? data.elements : [];

        let bestLimit = null;
        let bestDist = Infinity;
        const cameras = [];

        for (const el of elements) {
          const tags = el.tags || {};

          if (el.type === "way" && tags.maxspeed && el.center) {
            const limit = parseMaxspeed(tags.maxspeed);
            if (!limit) continue;

            const d = distanceM(lat, lon, el.center.lat, el.center.lon);
            if (d < bestDist) {
              bestDist = d;
              bestLimit = limit;
            }
          }

          const isSpeedCamera =
            tags.highway === "speed_camera" ||
            tags.enforcement === "maxspeed" ||
            tags.enforcement === "average_speed";

          if (isSpeedCamera) {
            const cLat = Number.isFinite(el.lat) ? el.lat : el.center?.lat;
            const cLon = Number.isFinite(el.lon) ? el.lon : el.center?.lon;

            if (Number.isFinite(cLat) && Number.isFinite(cLon)) {
              cameras.push({
                lat: cLat,
                lon: cLon,
                maxspeed: parseMaxspeed(tags.maxspeed),
                type: tags.enforcement || tags.highway || "speed_camera"
              });
            }
          }
        }

        osm.speedLimit = bestLimit;
        osm.source = bestLimit ? "OSM maxspeed" : "Ingen maxspeed nær GPS";
        osm.cameras = cameras;
      }

      function shouldFetchOsm(lat, lon) {
        if (osm.busy) return false;
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return false;
        if (!osm.lastFetchAt) return true;

        const age = Date.now() - osm.lastFetchAt;
        const moved = distanceM(lat, lon, osm.lastFetchLat, osm.lastFetchLon);

        return age > CFG.refetchMs || moved > CFG.refetchDistanceM;
      }

      async function maybeFetchOsm() {
        const { lat, lon, accuracy } = current;

        if (!shouldFetchOsm(lat, lon)) return;

        if (Number.isFinite(accuracy) && accuracy > 80) {
          setStatus("Venter på bedre GPS før fartsgrense hentes…");
          return;
        }

        osm.busy = true;
        osm.lastFetchAt = Date.now();
        osm.lastFetchLat = lat;
        osm.lastFetchLon = lon;

        try {
          setStatus("Henter fartsgrense/ATK…");
          const data = await fetchOverpass(lat, lon);
          processOsm(data, lat, lon);
          render();
        } catch (err) {
          osm.speedLimit = null;
          osm.source = "OSM-oppslag feilet";
          setStatus("Fartsgrense/ATK ikke hentet: " + (err.message || "ukjent feil"));
          render();
        } finally {
          osm.busy = false;
        }
      }

      function nearestRelevantCamera() {
        const { lat, lon, heading } = current;
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;

        let best = null;

        for (const cam of osm.cameras) {
          const d = distanceM(lat, lon, cam.lat, cam.lon);
          if (d > CFG.cameraWarnDistanceM) continue;

          let ahead = true;
          if (Number.isFinite(heading) && current.speedKmh > 8) {
            const b = bearingDeg(lat, lon, cam.lat, cam.lon);
            ahead = angleDiffDeg(heading, b) <= 75;
          }

          if (!ahead) continue;

          if (!best || d < best.distanceM) {
            best = { ...cam, distanceM: d };
          }
        }

        return best;
      }

      function render() {
        const speed = Number.isFinite(current.speedKmh) ? current.speedKmh : null;
        const limit = osm.speedLimit;
        const camera = nearestRelevantCamera();

        els.speed.textContent = speed === null ? "--" : String(Math.round(speed));

        if (limit) {
          els.speedSign.textContent = String(limit);
          els.speedSign.classList.remove("unknown");
        } else {
          els.speedSign.textContent = "?";
          els.speedSign.classList.add("unknown");
        }

        const over = speed !== null && limit && speed > limit + 5;
        els.speed.classList.toggle("danger", Boolean(over));
        els.speedSign.classList.toggle("blink", Boolean(over));

        if (camera) {
          els.atkBox.classList.add("show");
          els.atkText.textContent = Math.max(0, Math.round(camera.distanceM)) + " m";
        } else {
          els.atkBox.classList.remove("show");
        }

        if (!osm.busy) {
          const acc = Number.isFinite(current.accuracy) ? `GPS ±${Math.round(current.accuracy)} m` : "GPS";
          const lim = limit ? `${limit} km/t` : "ukjent fartsgrense";
          const cams = osm.cameras.length ? `${osm.cameras.length} ATK i område` : "ingen ATK funnet";
          setStatus(`${acc} · ${lim} · ${cams}`);
        }
      }

      function onPosition(pos) {
        const c = pos.coords;

        current.lat = c.latitude;
        current.lon = c.longitude;
        current.accuracy = c.accuracy;

        const mps = c.speed;
        const kmh = Number.isFinite(mps) && mps >= 0 ? mps * 3.6 : 0;

        current.speedKmh =
          kmh >= 0 && kmh < CFG.maxReasonableSpeedKmh
            ? kmh
            : current.speedKmh;

        current.heading =
          Number.isFinite(c.heading) && c.heading >= 0
            ? c.heading
            : current.heading;

        els.tapToStart.classList.remove("show");
        render();
        maybeFetchOsm();
      }

      function onGeoError(err) {
        let msg = "GPS-feil";
        if (err.code === 1) msg = "GPS nektet – gi stedstilgang i Safari.";
        if (err.code === 2) msg = "GPS utilgjengelig.";
        if (err.code === 3) msg = "GPS timeout.";
        setStatus(msg);
        els.tapToStart.classList.add("show");
      }

      async function requestWakeLock() {
        try {
          if ("wakeLock" in navigator && !wakeLock) {
            wakeLock = await navigator.wakeLock.request("screen");
          }
        } catch (_) {
          wakeLock = null;
        }
      }

      function startGps() {
        if (!("geolocation" in navigator)) {
          setStatus("Denne nettleseren støtter ikke GPS.");
          els.tapToStart.classList.add("show");
          return;
        }

        requestWakeLock();

        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }

        setStatus("Starter GPS…");

        watchId = navigator.geolocation.watchPosition(
          onPosition,
          onGeoError,
          { enableHighAccuracy: true, maximumAge: 500, timeout: 12000 }
        );
      }

      function tryAutoStart() {
        startGps();

        window.setTimeout(() => {
          if (!Number.isFinite(current.lat)) {
            els.tapToStart.classList.add("show");
          }
        }, 1800);
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) return;
        requestWakeLock();
        if (watchId !== null) startGps();
      });

      els.manualStart.addEventListener("click", () => {
        els.tapToStart.classList.remove("show");
        startGps();
      });

      window.addEventListener("load", tryAutoStart);
      window.addEventListener("orientationchange", () => window.scrollTo(0, 0));

      document.addEventListener("touchmove", (e) => {
        e.preventDefault();
      }, { passive: false });
    })();
  </script>
</body>
</html>
