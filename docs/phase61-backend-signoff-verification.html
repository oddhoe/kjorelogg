<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FASE 6.1A – backend sign-off</title>
  <style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body{max-width:920px;margin:2rem auto;padding:0 1rem;background:#111;color:#eee}section{border:1px solid #444;border-radius:.6rem;padding:1rem;margin:1rem 0}label{display:block;margin:.7rem 0 .25rem}input,button{font:inherit;padding:.65rem;border-radius:.35rem}input{width:min(100%,36rem);box-sizing:border-box}button{margin-top:1rem}.warning{color:#ffd166}.pass{color:#73e2a7}.fail{color:#ff7477}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#080808;padding:1rem;border-radius:.4rem}</style>
</head>
<body>
<h1>FASE 6.1A – backend runtime-regresjon</h1>
<p class="warning">Ingen IndexedDB åpnes. Kun isolerte <code>TEST_PHASE60_*</code>-rader skrives. Passord slettes fra feltene før testen starter og logges aldri. Testen stopper ved første FAIL.</p>
<section>
  <label for="email-a">TEST_A e-post</label><input id="email-a" value="odderling@gmail.com" autocomplete="username">
  <label for="password-a">TEST_A passord</label><input id="password-a" type="password" autocomplete="current-password">
  <label for="email-b">TEST_B e-post</label><input id="email-b" value="odderling@duck.com" autocomplete="username">
  <label for="password-b">TEST_B passord</label><input id="password-b" type="password" autocomplete="current-password">
  <button id="run">Kjør komplett sign-off-regresjon</button>
</section>
<section><h2>Resultat</h2><pre id="result">Venter.</pre></section>
<script src="./config.js?v=2.0.105"></script><script src="./vendor/supabase.min.js"></script>
<script>
(()=>{'use strict';
const cfg=window.KJORELOGG_CONFIG||{},out=document.getElementById('result'),button=document.getElementById('run');let lines=[];
const line=(s,k='INFO')=>{lines.push(`${k} ${s}`);out.textContent=lines.join('\n');out.className=k==='FAIL'?'fail':k==='PASS'?'pass':''};
const stop=(where,e)=>{const x=e||new Error('ukjent feil');line(`${where}: ${x.code||x.status||'ERROR'} ${x.message||String(x)}`,'FAIL');button.disabled=true;throw x};
if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY)stop('Config',new Error('Supabase-konfigurasjon mangler'));
const make=()=>supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const uuid=()=>crypto.randomUUID(),now=()=>new Date().toISOString();
async function ok(r,label){if(r.error)stop(label,r.error);line(label,'PASS');return r.data}
async function denied(promise,label,codes=[]){const r=await promise;if(r.error){if(codes.length&&!codes.includes(r.error.code))stop(label,r.error);line(`${label}${r.error.code?` (${r.error.code})`:''}`,'PASS');return r.error}if(Array.isArray(r.data)&&r.data.length===0){line(`${label} (0 rows)`,'PASS');return null}stop(label,new Error('operasjonen ble tillatt'))}
async function login(client,email,password,label){const r=await client.auth.signInWithPassword({email,password});if(r.error)stop(`${label} login`,r.error);line(`${label} real login`,'PASS');return r.data.user}
function leaseArgs(dataset,device,session){return{p_dataset_id:dataset,p_device_id:device,p_session_id:session}}
function road(user,dataset,device,session,generation,key,version='v2.0.105'){return{user_id:user,dataset_id:dataset,road_key:key,county_id:'15',road_category:'F',road_number:999,segment:'TEST_PHASE60',status:'ONE_DIRECTION',direction_fwd:true,direction_rev:false,manual_full:false,measured_at:now(),operator:'TEST_PHASE60',vehicle:'TEST_PHASE60',comment:'TEST_PHASE60',length_km:.1,client_updated_at:now(),device_id:device,updated_device_id:device,created_by:user,updated_by:user,work_session_id:session,fencing_generation:generation,client_version:version,last_mutation_id:uuid(),revision:1}}
async function cleanupVisibleTests(a){let r=await a.from('datasets').select('id,dataset_key').like('dataset_key','CONTROL_PHASE60%');if(r.error)stop('Control pre-cleanup lookup',r.error);for(const d of r.data){await ok(await a.from('datasets').update({dataset_key:`TEST_PHASE60_RECOVERED_${d.id}`}).eq('id',d.id).select().single(),`Rename stranded control ${d.dataset_key}`);await ok(await a.rpc('cleanup_test_dataset',{p_dataset_id:d.id}),`Cleanup stranded control ${d.dataset_key}`)}r=await a.from('datasets').select('id,dataset_key').like('dataset_key','TEST_PHASE60%');if(r.error)stop('Pre-cleanup lookup',r.error);for(const d of r.data)await ok(await a.rpc('cleanup_test_dataset',{p_dataset_id:d.id}),`Pre-cleanup ${d.dataset_key}`);line(`Pre-cleanup ferdig (${r.data.length} testdataset)`,'PASS')}

button.onclick=async()=>{button.disabled=true;const ea=document.getElementById('email-a').value.trim(),eb=document.getElementById('email-b').value.trim(),pa=document.getElementById('password-a').value,pb=document.getElementById('password-b').value;document.getElementById('password-a').value='';document.getElementById('password-b').value='';if(!pa||!pb){line('Begge passord kreves','FAIL');button.disabled=false;return}
 const a=make(),b=make(),anon=make();let datasetId=null,controlId=null;
 try{
  const ua=await login(a,ea,pa,'TEST_A'),ub=await login(b,eb,pb,'TEST_B');
  await cleanupVisibleTests(a);
  const unique=Date.now(),dataset=await ok(await a.rpc('create_dataset',{p_dataset_key:`TEST_PHASE60_SIGNOFF_${unique}`,p_name:'TEST_PHASE60 signoff',p_county:'TEST',p_vehicle:'TEST'}),'Create isolated shared dataset');datasetId=(Array.isArray(dataset)?dataset[0]:dataset).id;
  let r=await b.from('datasets').select('id').eq('id',datasetId);if(r.error||r.data.length)stop('Non-member SELECT dataset',r.error||new Error('row visible'));line('Non-member SELECT denied','PASS');
  await denied(b.from('road_progress').insert(road(ub.id,datasetId,'TEST_PHASE60_DEVICE_B',uuid(),1,'TEST_PHASE60_NONMEMBER')).select(),'Non-member INSERT denied');
  await denied(b.from('road_progress').update({comment:'TEST_PHASE60_FORBIDDEN'}).eq('dataset_id',datasetId).select(),'Non-member UPDATE denied');
  await ok(await a.rpc('add_dataset_member',{p_dataset_id:datasetId,p_user_id:ub.id,p_role:'driver'}),'TEST_B added as driver');
  r=await a.from('datasets').select('id').eq('id',datasetId);if(r.error||r.data.length!==1)stop('TEST_A shared SELECT',r.error||new Error('row missing'));line('TEST_A shared SELECT','PASS');r=await b.from('datasets').select('id').eq('id',datasetId);if(r.error||r.data.length!==1)stop('TEST_B shared SELECT',r.error||new Error('row missing'));line('TEST_B shared SELECT','PASS');
  await denied(anon.from('datasets').select('id').eq('id',datasetId),'Anon SELECT denied');await denied(anon.from('datasets').insert({dataset_key:'TEST_PHASE60_ANON',name:'forbidden',created_by:uuid()}).select(),'Anon INSERT denied');await denied(anon.from('datasets').update({name:'forbidden'}).eq('id',datasetId).select(),'Anon UPDATE denied');
  const deviceA='TEST_PHASE60_DEVICE_A',deviceB='TEST_PHASE60_DEVICE_B';await ok(await a.from('devices').upsert({user_id:ua.id,device_id:deviceA,device_name:'TEST_PHASE60 A',platform:'browser-test',app_version:'v2.0.105'},{onConflict:'user_id,device_id'}).select().single(),'Register device A');await ok(await b.from('devices').upsert({user_id:ub.id,device_id:deviceB,device_name:'TEST_PHASE60 B',platform:'browser-test',app_version:'v2.0.105'},{onConflict:'user_id,device_id'}).select().single(),'Register device B');
  const sessionA=uuid(),sessionB=uuid(),leaseAraw=await ok(await a.rpc('acquire_work_lease',leaseArgs(datasetId,deviceA,sessionA)),'TEST_A acquire generation 1'),leaseA=Array.isArray(leaseAraw)?leaseAraw[0]:leaseAraw;if(leaseA.fencing_generation!==1)stop('Generation 1',new Error(`fikk ${leaseA.fencing_generation}`));line('TEST_A fencing generation 1','PASS');
  await denied(b.rpc('acquire_work_lease',leaseArgs(datasetId,deviceB,sessionB)),'Second-driver rejected',['PT423']);
  const renew={p_lease_id:leaseA.id,p_device_id:deviceA,p_session_id:sessionA,p_fencing_generation:1};await ok(await a.rpc('renew_work_lease',renew),'Renew correct user/device/session/generation');await denied(a.rpc('renew_work_lease',{...renew,p_device_id:'TEST_PHASE60_WRONG_DEVICE'}),'Renew wrong device denied',['PT412']);await denied(a.rpc('renew_work_lease',{...renew,p_session_id:uuid()}),'Renew wrong session denied',['PT412']);await denied(a.rpc('renew_work_lease',{...renew,p_fencing_generation:999999}),'Renew wrong generation denied',['PT412']);
  const old=road(ua.id,datasetId,deviceA,sessionA,1,'TEST_PHASE60_MIN_VERSION','v2.0.104');await denied(a.from('road_progress').insert(old).select(),'v2.0.104 write denied',['PT426']);const initial=road(ua.id,datasetId,deviceA,sessionA,1,'TEST_PHASE60_ROAD');let row=await ok(await a.from('road_progress').insert(initial).select().single(),'v2.0.105 write allowed');
  await ok(await a.rpc('release_work_lease',{p_lease_id:leaseA.id,p_session_id:sessionA,p_fencing_generation:1}),'Release generation 1');const leaseBraw=await ok(await b.rpc('acquire_work_lease',leaseArgs(datasetId,deviceB,sessionB)),'TEST_B acquire generation 2'),leaseB=Array.isArray(leaseBraw)?leaseBraw[0]:leaseBraw;if(leaseB.fencing_generation!==2)stop('Generation 2',new Error(`fikk ${leaseB.fencing_generation}`));line('TEST_B fencing generation 2','PASS');
  const update={status:'COMPLETED',direction_fwd:true,direction_rev:true,revision:row.revision,last_mutation_id:uuid(),client_updated_at:now(),updated_by:ub.id,updated_device_id:deviceB,work_session_id:sessionB,fencing_generation:2,client_version:'v2.0.105'};row=await ok(await b.from('road_progress').update(update).eq('id',row.id).select().single(),'Correct revision + fencing');
  await denied(b.from('road_progress').update({...update,revision:1,last_mutation_id:uuid()}).eq('id',row.id).select(),'Stale revision denied',['PT409']);await denied(a.from('road_progress').update({...update,revision:row.revision,last_mutation_id:uuid(),updated_by:ua.id,updated_device_id:deviceA,work_session_id:sessionA,fencing_generation:1}).eq('id',row.id).select(),'Old fencing denied',['PT412']);
  await denied(b.from('road_progress').update({...update,dataset_id:null,revision:row.revision,last_mutation_id:uuid()}).eq('id',row.id).select(),'dataset_id NULL bypass denied',['22023']);await denied(b.from('road_progress').update({...update,dataset_id:uuid(),revision:row.revision,last_mutation_id:uuid()}).eq('id',row.id).select(),'dataset_id move denied',['22023']);line('Legacy NULL path cannot bypass dataset fencing','PASS');
  const mutation=uuid(),idem={...update,comment:'TEST_PHASE60_IDEMPOTENT',revision:row.revision,last_mutation_id:mutation};const once=await ok(await b.from('road_progress').update(idem).eq('id',row.id).select().single(),'Idempotent mutation first effect');for(let i=0;i<10;i++){const x=await ok(await b.from('road_progress').update(idem).eq('id',row.id).select().single(),`Idempotent retry ${i+1}/10`);if(x.revision!==once.revision)stop('Idempotency revision',new Error(`${x.revision} != ${once.revision}`))}const auditRows=await ok(await b.from('sync_audit_log').select('*').eq('dataset_id',datasetId).eq('mutation_id',mutation),'Audit exactly-once readback');if(auditRows.length!==1)stop('Audit exactly once',new Error(`rows=${auditRows.length}`));const audit=auditRows[0];for(const k of ['dataset_id','user_id','device_id','session_id','mutation_id','previous_revision','new_revision','old_status','new_status','fencing_generation','client_version','server_created_at'])if(audit[k]===null||audit[k]===undefined)stop('Audit fields',new Error(`mangler ${k}`));line('Audit fields complete and exactly once','PASS');
  await denied(b.from('sync_audit_log').insert({...audit,id:undefined}).select(),'Direct audit INSERT denied',['42501']);await denied(b.from('sync_audit_log').update({new_status:'FORBIDDEN'}).eq('id',audit.id).select(),'Direct audit UPDATE denied',['42501']);await denied(b.from('sync_audit_log').delete().eq('id',audit.id).select(),'Direct audit DELETE denied',['42501']);
  await ok(await a.rpc('add_dataset_member',{p_dataset_id:datasetId,p_user_id:ub.id,p_role:'read_only'}),'TEST_B role read_only');r=await b.from('road_progress').select('id').eq('id',row.id);if(r.error||r.data.length!==1)stop('read_only SELECT',r.error||new Error('row missing'));line('read_only SELECT allowed','PASS');await denied(b.from('road_progress').update({comment:'TEST_PHASE60_READONLY'}).eq('id',row.id).select(),'read_only write denied');
  const control=await ok(await a.rpc('create_dataset',{p_dataset_key:`CONTROL_PHASE60_${unique}`,p_name:'non-test cleanup guard',p_county:'TEST',p_vehicle:'TEST'}),'Create non-test cleanup control');controlId=(Array.isArray(control)?control[0]:control).id;await denied(a.rpc('cleanup_test_dataset',{p_dataset_id:controlId}),'Non-test cleanup denied',['PT403']);await ok(await a.from('datasets').update({dataset_key:`TEST_PHASE60_CONTROL_${unique}`}).eq('id',controlId).select().single(),'Rename control to permitted test prefix');await ok(await a.rpc('cleanup_test_dataset',{p_dataset_id:controlId}),'Cleanup renamed test control');controlId=null;
  const cleaned=await ok(await a.rpc('cleanup_test_dataset',{p_dataset_id:datasetId}),'Full TEST_PHASE60 cleanup');for(const k of ['road_progress','measurement_tracks','asphalt_progress','asphalt_plans','app_settings','day_plans','sync_audit_log','work_leases','dataset_members','datasets'])if(typeof cleaned[k]!=='number')stop('Cleanup result',new Error(`mangler count ${k}`));if(cleaned.datasets!==1||cleaned.road_progress!==1)stop('Cleanup counts',new Error(JSON.stringify(cleaned)));line(`Cleanup counts ${JSON.stringify(cleaned)}`,'PASS');datasetId=null;
  r=await a.from('datasets').select('id',{count:'exact',head:true}).like('dataset_key','TEST_PHASE60%');if(r.error||r.count!==0)stop('Final dataset cleanup verification',r.error||new Error(`count=${r.count}`));line('0 TEST_PHASE60 datasets remain','PASS');
  await a.auth.signOut();await b.auth.signOut();line('BACKEND SIGN-OFF RUNTIME REGRESSION COMPLETE','PASS')
 }catch(e){if(!out.classList.contains('fail'))stop('Runtime regression',e)}
};
})();
</script>
</body></html>
