<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kjørelogg – FASE 6.1D kanonisk baseline</title>
<style>body{margin:0;background:#10151b;color:#edf2f7;font:14px system-ui}main{max-width:1100px;margin:auto;padding:20px}section{background:#1b222c;border:1px solid #344150;border-radius:14px;padding:18px}button{border:0;border-radius:9px;padding:11px 15px;background:#1769aa;color:#fff;font-weight:800}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1117;padding:14px;border-radius:10px}.warn{color:#ffd08a}</style></head>
<body><main><h1>FASE 6.1D – kanonisk fagbaseline</h1><section>
<p class="warn">Kun read-only IndexedDB. Siden starter ikke app, Auth eller TEST_PHASE61-sync. Den eneste kanoniske eksklusjonen er <code>_bbox</code>.</p>
<button id="run">Analyser og bygg baseline-kandidat</button> <button id="download" disabled>Last ned godkjent kandidat</button>
<pre id="out">Ikke kjørt.</pre></section></main><script src="./pre-migration-snapshot.js?v=2"></script><script>
(()=>{'use strict';
const DB='nvdb_tiles',APP='appdata',SNAPS='progress_snapshots';
const ROAD=['mr_veg_nvdb_state','mr_veg_dir_state_v1','mr_veg_route_log_v1','mr_veg_geom_v2','mr_veg_road_comments_v1','__kjorelogg_progress_state_v3'];
const ALL=[...ROAD,'mr_veg_asphalt_plan_v1'],SPECIAL=['Fv5981_S1D1','Fv64_S3D1'];
const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error||new Error('IndexedDB read feilet'))});
const type=v=>v===null?'null':Array.isArray(v)?'array':typeof v;
const count=v=>Array.isArray(v)?v.length:v&&typeof v==='object'?(v.state&&typeof v.state==='object'?['driven','oneWay','skip','deletedGeom','deletedGeomKeys'].reduce((n,k)=>n+(Array.isArray(v.state[k])?v.state[k].length:0),0):Object.keys(v).length):v==null?0:1;
const own=(v,k)=>!!v&&typeof v==='object'&&Object.hasOwn(v,k),logical=raw=>own(raw,'value')?raw.value:raw;
const clone=v=>v===undefined?undefined:structuredClone(v);
function canonicalize(value){if(Array.isArray(value))return value.map(canonicalize);if(value&&typeof value==='object'){const out={};for(const key of Object.keys(value).sort()){if(key==='_bbox')continue;out[key]=canonicalize(value[key])}return out}return value}
async function bytes(value){return window.KjoreloggPreMigrationSnapshot.canonicalSnapshotBytes(value)}
async function hash(value){const b=await bytes(value),d=await crypto.subtle.digest('SHA-256',b);return{sha256:[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join(''),bytes:b.length}}
async function databaseListObservation(){if(typeof indexedDB.databases!=='function')return{available:false};try{const list=await indexedDB.databases();return{available:true,advisory_only:true,entries:list.map(x=>({name:x.name||null,version:x.version??null})),target_listed:list.some(x=>x.name===DB)}}catch(error){return{available:true,advisory_only:true,error:error.message||String(error)}}}
function openExisting(){return new Promise((ok,no)=>{let settled=false,created=false,blocked=false,r;const finish=(fn,value)=>{if(settled)return;settled=true;clearTimeout(timer);fn(value)},timer=setTimeout(()=>finish(no,new Error(blocked?'Databaseåpning blokkert av en annen fane.':'Tidsavbrudd ved versjonsløs databaseåpning.')),12000);try{r=indexedDB.open(DB)}catch(error){finish(no,error);return}r.onblocked=()=>{blocked=true;finish(no,new Error('Databaseåpning blokkert av en annen fane.'))};r.onupgradeneeded=()=>{created=true;try{r.transaction.abort()}catch(_){}finish(no,new Error(`${DB} eksisterte ikke i denne nettleserprofilen; opprettelse ble abortert uten write.`))};r.onsuccess=()=>{const db=r.result;if(settled){db.close();return}if(created){db.close();finish(no,new Error(`${DB} eksisterte ikke i denne nettleserprofilen.`));return}db.onversionchange=()=>db.close();finish(ok,db)};r.onerror=()=>finish(no,new Error(r.error?.message||'IndexedDB open feilet'))})}
async function rows(db,store){const s=db.transaction(store,'readonly').objectStore(store),[ks,vs]=await Promise.all([req(s.getAllKeys()),req(s.getAll())]);return ks.map((key,i)=>({key:String(key),raw:vs[i]}))}
async function storeCount(db,store){return req(db.transaction(store,'readonly').objectStore(store).count())}
function oldBaseline(asphalt){for(const row of asphalt||[]){const fp=row?.roadBaselineFingerprint;if(fp?.records&&ROAD.every(k=>fp.records[k]))return fp}return null}
function snapshotCandidates(raw,key){const s=raw&&typeof raw==='object'?raw:{},p={
 'mr_veg_nvdb_state':[['$.state',s.state],['$.sources.runtime_state.state',s.sources?.runtime_state?.state]],
 'mr_veg_dir_state_v1':[['$.directionState',s.directionState],['$.sources.runtime_state.directionState',s.sources?.runtime_state?.directionState]],
 'mr_veg_route_log_v1':[['$.routeLog',s.routeLog],['$.sources.runtime_state.routeLog',s.sources?.runtime_state?.routeLog]],
 'mr_veg_geom_v2':[['$.geomCache',s.geomCache],['$.sources.runtime_state.geomCache',s.sources?.runtime_state?.geomCache]],
 'mr_veg_road_comments_v1':[['$.roadComments',s.roadComments],['$.sources.runtime_state.roadComments',s.sources?.runtime_state?.roadComments]],
 '__kjorelogg_progress_state_v3':[['$',s],['$.sources.runtime_state',s.sources?.runtime_state]]};
 return(p[key]||[]).filter(x=>x[1]!==undefined).map(([path,value])=>({path,value}))}
const sorted=a=>[...a].map(String).sort();
function statusCounts(state){const s=state?.state&&typeof state.state==='object'?state.state:state||{};return{driven:(s.driven||[]).length,oneWay:(s.oneWay||[]).length,skip:(s.skip||[]).length,deletedGeom:(s.deletedGeom||s.deletedGeomKeys||[]).length}}
function directionCounts(value){const out={records:0,fwd:0,rev:0,both:0};for(const v of Object.values(value||{})){out.records++;if(v?.fwd)out.fwd++;if(v?.rev)out.rev++;if(v?.fwd&&v?.rev)out.both++}return out}
function stableRoad(record,key){return{map_key:key,key:record?.key??null,veg:record?.veg??null,seg:record?.seg??null,gsv:record?.gsv??null,kat:record?.kat??null,fylke:record?.fylke??null,kommune:record?.kommune??null,typeVeg:record?.typeVeg??null,typeVegText:record?.typeVegText??null,detaljnivaa:record?.detaljnivaa??null}}
async function findPayload(snapshots,key,expected){for(const snap of snapshots){for(const c of snapshotCandidates(snap.raw,key)){if((await hash(c.value)).sha256===expected)return{snapshot:snap.key,path:c.path,value:c.value}}}return null}
async function run(){const report={phase:'6.1D',mode:'READ_ONLY',writes:false,'location.origin':location.origin,canonical_exclusions:['_bbox'],sync_test_continues:false,database_detection:null,database:null,records:[],special_geometry:[],gates:{},baseline_candidate:null};if(location.origin!=='https://oddhoe.github.io'){report.stop='WRONG_ORIGIN';report.error=`Forventet https://oddhoe.github.io, fikk ${location.origin}`;return report}const listObservation=await databaseListObservation();report.database_detection={method:'versionless indexedDB.open with abort-on-upgrade',indexedDB_databases:listObservation};const db=await openExisting();try{
 const stores=[...db.objectStoreNames],missing=[APP,SNAPS].filter(x=>!stores.includes(x));if(missing.length)throw new Error(`Eksisterende ${DB} mangler påkrevde stores: ${missing.join(', ')}`);report.database={name:db.name,version:db.version,objectStoreNames:stores,appdata_count:await storeCount(db,APP),progress_snapshots_count:await storeCount(db,SNAPS)};
 const app=await rows(db,APP),map=new Map(app.map(x=>[x.key,x.raw])),asphalt=logical(map.get('mr_veg_asphalt_plan_v1')),previous=oldBaseline(asphalt),snapshots=await rows(db,SNAPS);if(!previous)throw new Error('FASE 5.7-baseline mangler');
 const current={},before={};for(const key of ALL)current[key]=logical(map.get(key));
 for(const key of ROAD){const p=await findPayload(snapshots,key,previous.records[key].sha256);if(p)before[key]=p;report.records.push({record:key,previous_payload:p?{snapshot:p.snapshot,path:p.path}:null,current_raw:await hash(current[key]),current_canonical:await hash(canonicalize(current[key])),payload_captured_for_next_diff:true})}
 const bg=before['mr_veg_geom_v2']?.value,cg=current['mr_veg_geom_v2'];for(const key of SPECIAL){const a=bg?.[key],b=cg?.[key];report.special_geometry.push({key,before:{kortform:a?.kortform??null,fylkeSource:{present:own(a,'fylkeSource'),value:a?.fylkeSource??null}},after:{kortform:b?.kortform??null,fylkeSource:{present:own(b,'fylkeSource'),value:b?.fylkeSource??null}},parts_match:a&&b?(await hash(a.parts)).sha256===(await hash(b.parts)).sha256:null,writer_assessment:{path:'normal boot/cache merge: normalizeLegacyGeomCache() + mergeRoadIntoGeomCache()',evidence:'mergeRoadIntoGeomCache() replaces the record, selects r.kortform before old.kortform, and omits fylkeSource; pilot-sync-v105.js never reads or writes mr_veg_geom_v2',test_phase61_sync:false}})}
 const bs=before['mr_veg_nvdb_state']?.value,bd=before['mr_veg_dir_state_v1']?.value,bgeom=before['mr_veg_geom_v2']?.value;
 const statusOk=!!bs&&JSON.stringify(statusCounts(bs))===JSON.stringify(statusCounts(current['mr_veg_nvdb_state'])),directionOk=!!bd&&JSON.stringify(directionCounts(bd))===JSON.stringify(directionCounts(current['mr_veg_dir_state_v1']));
 let partsOk=!!bgeom,identityOk=!!bgeom;if(bgeom){const keys=new Set([...Object.keys(bgeom),...Object.keys(cg||{})]);if(sorted(Object.keys(bgeom)).join('\0')!==sorted(Object.keys(cg||{})).join('\0'))identityOk=false;for(const key of keys){const a=bgeom[key],b=cg?.[key];if(!a||!b){partsOk=false;identityOk=false;continue}if((await hash(a.parts)).sha256!==(await hash(b.parts)).sha256)partsOk=false;if((await hash(stableRoad(a,key))).sha256!==(await hash(stableRoad(b,key))).sha256)identityOk=false}}
 const specialExplained=report.special_geometry.every(x=>x.parts_match&&x.writer_assessment.test_phase61_sync===false);report.gates={fagstatus_counts_unchanged:statusOk,direction_counts_unchanged:directionOk,geometry_parts_unchanged:partsOk,road_identity_stable_keys_unchanged:identityOk,kortform_fylkeSource_explained_or_corrected:specialExplained,asphalt_included:Array.isArray(asphalt)};
 const approved=Object.values(report.gates).every(Boolean),records={};for(const key of ALL){const payload=canonicalize(clone(current[key])),h=await hash(payload);records[key]={count:count(current[key]),type:type(current[key]),bytes:h.bytes,sha256:h.sha256,payload}}
 const core={schema:'kjorelogg-canonical-road-baseline-v1',app_version:'v2.0.105',created_at:new Date().toISOString(),canonical_exclusions:['_bbox'],records};report.baseline_candidate={approved,blocked_reasons:Object.entries(report.gates).filter(([,v])=>!v).map(([k])=>k),...core,baseline_sha256:(await hash(core)).sha256};return report
 }finally{db.close()}}
let latest=null;document.getElementById('run').onclick=async()=>{const out=document.getElementById('out'),dl=document.getElementById('download');dl.disabled=true;out.textContent='Kontrollerer origin før databaseåpning …';try{latest=await run();out.textContent=JSON.stringify(latest,null,2);dl.disabled=!latest.baseline_candidate?.approved;window.__PHASE61D_REPORT__=latest}catch(e){latest=null;out.textContent=`FAIL ${e.name}: ${e.message}\nIngen writes ble utført.`}};
document.getElementById('download').onclick=()=>{if(!latest?.baseline_candidate?.approved)return;const blob=new Blob([JSON.stringify(latest.baseline_candidate,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kjorelogg-v2.0.105-canonical-baseline-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
})();</script></body></html>
