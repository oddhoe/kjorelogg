<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kjørelogg – FASE 6.1D kanonisk baseline</title>
<style>body{margin:0;background:#10151b;color:#edf2f7;font:14px system-ui}main{max-width:1100px;margin:auto;padding:20px}section{background:#1b222c;border:1px solid #344150;border-radius:14px;padding:18px}button{border:0;border-radius:9px;padding:11px 15px;background:#1769aa;color:#fff;font-weight:800}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1117;padding:14px;border-radius:10px}.warn{color:#ffd08a}</style></head>
<body><main><h1>FASE 6.1D – kanonisk fagbaseline</h1><section>
<p class="warn">Kun read-only IndexedDB. Siden starter ikke app, Auth eller TEST_PHASE61-sync. Den eneste kanoniske eksklusjonen er <code>_bbox</code>.</p>
<button id="run" disabled>Analyser og bygg baseline-kandidat</button> <button id="download" disabled>Last ned godkjent kandidat</button>
<pre id="out">Ikke kjørt.</pre></section></main><script>
(()=>{'use strict';
const DB='nvdb_tiles',APP='appdata',SNAPS='progress_snapshots';
const ROAD=['mr_veg_nvdb_state','mr_veg_dir_state_v1','mr_veg_route_log_v1','mr_veg_geom_v2','mr_veg_road_comments_v1','__kjorelogg_progress_state_v3'];
const ALL=[...ROAD,'mr_veg_asphalt_plan_v1'],SPECIAL=['Fv5981_S1D1','Fv64_S3D1'];
const out=document.getElementById('out'),runButton=document.getElementById('run'),downloadButton=document.getElementById('download');let visibleSteps=[];
const show=text=>{out.textContent=text},step=text=>{visibleSteps.push(text);show(visibleSteps.join('\n'))},fail=(code,message)=>show(`${visibleSteps.join('\n')}\nFAIL ${code}: ${message}\nIngen writes ble utført.`.trim());
function timeout(promise,ms,code){let timer;return Promise.race([Promise.resolve(promise),new Promise((_,no)=>{timer=setTimeout(()=>{const e=new Error(`${code} etter ${ms} ms`);e.code=code;no(e)},ms)})]).finally(()=>clearTimeout(timer))}
const req=(r,label='IDB_READ_TIMEOUT',ms=30000)=>timeout(new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error||new Error('IndexedDB read feilet'))}),ms,label);
const type=v=>v===null?'null':Array.isArray(v)?'array':typeof v;
const count=v=>Array.isArray(v)?v.length:v&&typeof v==='object'?(v.state&&typeof v.state==='object'?['driven','oneWay','skip','deletedGeom','deletedGeomKeys'].reduce((n,k)=>n+(Array.isArray(v.state[k])?v.state[k].length:0),0):Object.keys(v).length):v==null?0:1;
const own=(v,k)=>!!v&&typeof v==='object'&&Object.hasOwn(v,k),logical=raw=>own(raw,'value')?raw.value:raw;
const clone=v=>v===undefined?undefined:structuredClone(v),encoder=new TextEncoder(),yieldUi=()=>new Promise(ok=>setTimeout(ok,0));
function canonicalize(value,excludeDerived=true){if(value===undefined)return{$type:'Undefined'};if(Array.isArray(value))return value.map(v=>canonicalize(v,excludeDerived));if(value&&typeof value==='object'){const out={};for(const key of Object.keys(value).sort()){if(excludeDerived&&key==='_bbox')continue;out[key]=canonicalize(value[key],excludeDerived)}return out}return value}
async function hash(value,excludeDerived=false){const b=encoder.encode(JSON.stringify(canonicalize(value,excludeDerived))),d=await timeout(crypto.subtle.digest('SHA-256',b),30000,'SHA256_TIMEOUT');return{sha256:[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join(''),bytes:b.length}}
async function databaseListObservation(){if(typeof indexedDB.databases!=='function')return{available:false,advisory_only:true};try{const list=await timeout(indexedDB.databases(),3000,'DATABASES_ADVISORY_TIMEOUT');return{available:true,advisory_only:true,entries:list.map(x=>({name:x.name||null,version:x.version??null})),target_listed:list.some(x=>x.name===DB)}}catch(error){return{available:true,advisory_only:true,warning:error.code||error.name||'DATABASES_ADVISORY_ERROR',error:error.message||String(error),continued_to_safe_open:true}}}
function openExisting(){return new Promise((ok,no)=>{let settled=false,created=false,blocked=false,r;const error=(code,message)=>Object.assign(new Error(message),{code}),finish=(fn,value)=>{if(settled)return;settled=true;clearTimeout(timer);fn(value)},timer=setTimeout(()=>finish(no,error(blocked?'DB_OPEN_BLOCKED':'DB_OPEN_TIMEOUT',blocked?'Databaseåpning blokkert av en annen fane.':'Tidsavbrudd ved versjonsløs databaseåpning.')),12000);try{r=indexedDB.open(DB)}catch(cause){finish(no,Object.assign(cause,{code:'DB_OPEN_ERROR'}));return}r.onblocked=()=>{blocked=true;finish(no,error('DB_OPEN_BLOCKED','Databaseåpning blokkert av en annen fane.'))};r.onupgradeneeded=()=>{created=true;try{r.transaction.abort()}catch(_){}finish(no,error('DB_NOT_EXISTING',`${DB} eksisterte ikke i denne nettleserprofilen; opprettelse ble abortert uten write.`))};r.onsuccess=()=>{const db=r.result;if(settled){db.close();return}if(created){db.close();finish(no,error('DB_NOT_EXISTING',`${DB} eksisterte ikke i denne nettleserprofilen.`));return}db.onversionchange=()=>db.close();finish(ok,db)};r.onerror=()=>finish(no,error('DB_OPEN_ERROR',r.error?.message||'IndexedDB open feilet'))})}
async function rows(db,store){const s=db.transaction(store,'readonly').objectStore(store),[ks,vs]=await Promise.all([req(s.getAllKeys()),req(s.getAll())]);return ks.map((key,i)=>({key:String(key),raw:vs[i]}))}
async function storeCount(db,store){return req(db.transaction(store,'readonly').objectStore(store).count())}
function oldBaseline(asphalt){for(const row of asphalt||[]){const fp=row?.roadBaselineFingerprint;if(fp?.records&&ROAD.every(k=>fp.records[k]))return fp}return null}
function snapshotCandidates(raw,key){const s=raw&&typeof raw==='object'?raw:{},p={
 'mr_veg_nvdb_state':[['$.state',s.state],['$.sources.runtime_state.state',s.sources?.runtime_state?.state]],
 'mr_veg_dir_state_v1':[['$.directionState',s.directionState],['$.sources.runtime_state.directionState',s.sources?.runtime_state?.directionState]],
 'mr_veg_route_log_v1':[['$.routeLog',s.routeLog],['$.sources.runtime_state.routeLog',s.sources?.runtime_state?.routeLog]],
 'mr_veg_geom_v2':[['$.geomCache',s.geomCache],['$.sources.runtime_state.geomCache',s.sources?.runtime_state?.geomCache]],
 'mr_veg_road_comments_v1':[['$.roadComments',s.roadComments],['$.sources.runtime_state.roadComments',s.sources?.runtime_state?.roadComments]],
 '__kjorelogg_progress_state_v3':[['$',s],['$.sources.runtime_state',s.sources?.runtime_state]]};
 return(p[key]||[]).filter(x=>x[1]!==undefined).map(([path,value])=>({path,value}))}
const sorted=a=>[...a].map(String).sort();
function statusCounts(state){const s=state?.state&&typeof state.state==='object'?state.state:state||{};return{driven:(s.driven||[]).length,oneWay:(s.oneWay||[]).length,skip:(s.skip||[]).length,deletedGeom:(s.deletedGeom||s.deletedGeomKeys||[]).length}}
function directionCounts(value){const out={records:0,fwd:0,rev:0,both:0};for(const v of Object.values(value||{})){out.records++;if(v?.fwd)out.fwd++;if(v?.rev)out.rev++;if(v?.fwd&&v?.rev)out.both++}return out}
function stableRoad(record,key){return{map_key:key,key:record?.key??null,veg:record?.veg??null,seg:record?.seg??null,gsv:record?.gsv??null,kat:record?.kat??null,fylke:record?.fylke??null,kommune:record?.kommune??null,typeVeg:record?.typeVeg??null,typeVegText:record?.typeVegText??null,detaljnivaa:record?.detaljnivaa??null}}
const validKey=key=>typeof key==='string'&&key.trim()===key&&key.length>0,unique=a=>Array.isArray(a)&&new Set(a).size===a.length;
function currentConsistency(state,direction,geom,route,comments,progress,asphalt){const driven=state?.driven||[],oneWay=state?.oneWay||[],skip=state?.skip||[],deleted=state?.deletedGeom||state?.deletedGeomKeys||[],sets={driven:new Set(driven),oneWay:new Set(oneWay),skip:new Set(skip)},allStatus=[...driven,...oneWay,...skip],directionErrors=[];for(const[key,value]of Object.entries(direction||{})){const f=value?.fwd===true,r=value?.rev===true;if(!validKey(key)||!geom?.[key])directionErrors.push({key,reason:'missing_or_invalid_geometry_key'});else if(!f&&!r)directionErrors.push({key,reason:'no_direction_set'});else if(sets.skip.has(key))directionErrors.push({key,reason:'skipped_has_direction'});else if(f&&r&&!sets.driven.has(key))directionErrors.push({key,reason:'both_not_driven'});else if((f!==r)&&!sets.driven.has(key)&&!sets.oneWay.has(key))directionErrors.push({key,reason:'single_direction_without_status'})}for(const key of oneWay){const d=direction?.[key];if(d&&(!!d.fwd===!!d.rev))directionErrors.push({key,reason:'oneWay_direction_mismatch'})}const invalidOrDuplicate=!unique(driven)||!unique(oneWay)||!unique(skip)||!unique(deleted)||allStatus.some(k=>!validKey(k))||Object.keys(direction||{}).some(k=>!validKey(k))||Object.keys(geom||{}).some(k=>!validKey(k))||driven.some(k=>sets.oneWay.has(k)||sets.skip.has(k))||oneWay.some(k=>sets.skip.has(k));const planKeys=(asphalt||[]).map(row=>row?.planKey);const asphaltValid=Array.isArray(asphalt)&&asphalt.length===102&&asphalt.every(row=>row&&typeof row==='object'&&validKey(row.planKey))&&new Set(planKeys).size===102;const nonempty=state&&typeof state==='object'&&[driven,oneWay,skip,deleted].every(Array.isArray)&&geom&&typeof geom==='object'&&Object.keys(geom).length>0&&direction&&typeof direction==='object'&&route&&typeof route==='object'&&comments&&typeof comments==='object'&&progress&&typeof progress==='object'&&progress.state&&typeof progress.state==='object'&&asphaltValid;return{counts:{status:statusCounts(state),direction:directionCounts(direction),geometry_records:Object.keys(geom||{}).length,route_records:Object.keys(route||{}).length,comment_records:Object.keys(comments||{}).length,asphalt_records:Array.isArray(asphalt)?asphalt.length:0},direction_errors:directionErrors.slice(0,50),direction_status_consistent:directionErrors.length===0,no_invalid_or_duplicate_keys:!invalidOrDuplicate,asphalt_plan_102_valid:asphaltValid,nonempty_uncorrupted_state:!!nonempty}}
async function findPayload(snapshots,key,expected){let checked=0;for(const snap of snapshots){for(const c of snapshotCandidates(snap.raw,key)){if((await hash(c.value)).sha256===expected)return{snapshot:snap.key,path:c.path,value:c.value};if(++checked%8===0)await yieldUi()}}return null}
async function run(){const report={phase:'6.1D',mode:'READ_ONLY',writes:false,'location.origin':location.origin,canonical_exclusions:['_bbox'],sync_test_continues:false,steps:[],database_detection:null,database:null,records:[],special_geometry:[],gates:{},baseline_candidate:null},mark=text=>{report.steps.push(text);step(text)};if(location.origin!=="https://oddhoe.github.io"){mark('STEP 1 FAIL WRONG_ORIGIN');report.stop='WRONG_ORIGIN';report.error=`Forventet https://oddhoe.github.io, fikk ${location.origin}`;return report}mark('STEP 1 origin OK');if(!globalThis.indexedDB){mark('STEP 2 FAIL IndexedDB API mangler');report.stop='INDEXEDDB_UNAVAILABLE';return report}mark('STEP 2 IndexedDB API tilgjengelig');const listObservation=await databaseListObservation();mark(`STEP 3 databases() advisory result: ${listObservation.warning?'WARNING '+listObservation.warning:'OK'}`);report.database_detection={method:'versionless indexedDB.open with abort-on-upgrade',indexedDB_databases:listObservation};const db=await openExisting();mark(`STEP 4 safe existing DB open: version ${db.version}`);try{
 const stores=[...db.objectStoreNames],missing=[APP,SNAPS].filter(x=>!stores.includes(x));if(missing.length)throw new Error(`Eksisterende ${DB} mangler påkrevde stores: ${missing.join(', ')}`);report.database={name:db.name,version:db.version,objectStoreNames:stores,appdata_count:await storeCount(db,APP),progress_snapshots_count:await storeCount(db,SNAPS)};
 const app=await rows(db,APP),map=new Map(app.map(x=>[x.key,x.raw])),asphalt=logical(map.get('mr_veg_asphalt_plan_v1')),previous=oldBaseline(asphalt),snapshots=await rows(db,SNAPS);mark(`STEP 5 appdata read: ${report.database.appdata_count}; progress_snapshots: ${report.database.progress_snapshots_count}`);if(!previous)throw new Error('FASE 5.7-baseline mangler');mark('STEP 6 canonical analysis');
 const current={},before={};for(const key of ALL)current[key]=logical(map.get(key));
 for(const key of ROAD){const currentRaw=await hash(current[key]);let p=null;if(key==='mr_veg_geom_v2')p=await findPayload(snapshots,key,previous.records[key].sha256);if(p)before[key]=p;report.records.push({record:key,previous_payload:p?{snapshot:p.snapshot,path:p.path}:null,current_raw:currentRaw,current_canonical:await hash(current[key],true),payload_captured_for_next_diff:true});await yieldUi()}
 const bg=before['mr_veg_geom_v2']?.value,cg=current['mr_veg_geom_v2'];for(const key of SPECIAL){const a=bg?.[key],b=cg?.[key];report.special_geometry.push({key,before:{kortform:a?.kortform??null,fylkeSource:{present:own(a,'fylkeSource'),value:a?.fylkeSource??null}},after:{kortform:b?.kortform??null,fylkeSource:{present:own(b,'fylkeSource'),value:b?.fylkeSource??null}},parts_match:a&&b?(await hash(a.parts)).sha256===(await hash(b.parts)).sha256:null,writer_assessment:{path:'normal boot/cache merge: normalizeLegacyGeomCache() + mergeRoadIntoGeomCache()',evidence:'mergeRoadIntoGeomCache() replaces the record, selects r.kortform before old.kortform, and omits fylkeSource; pilot-sync-v105.js never reads or writes mr_veg_geom_v2',test_phase61_sync:false}})}
 const bgeom=before['mr_veg_geom_v2']?.value;
 let partsOk=!!bgeom,identityOk=!!bgeom;if(bgeom){const keys=new Set([...Object.keys(bgeom),...Object.keys(cg||{})]);if(sorted(Object.keys(bgeom)).join('\0')!==sorted(Object.keys(cg||{})).join('\0'))identityOk=false;let i=0;for(const key of keys){const a=bgeom[key],b=cg?.[key];if(!a||!b){partsOk=false;identityOk=false;continue}if((await hash(a.parts)).sha256!==(await hash(b.parts)).sha256)partsOk=false;if((await hash(stableRoad(a,key))).sha256!==(await hash(stableRoad(b,key))).sha256)identityOk=false;if(++i%100===0)await yieldUi()}}
 const consistency=currentConsistency(current['mr_veg_nvdb_state'],current['mr_veg_dir_state_v1'],cg,current['mr_veg_route_log_v1'],current['mr_veg_road_comments_v1'],current['__kjorelogg_progress_state_v3'],asphalt),specialExplained=report.special_geometry.every(x=>x.parts_match&&x.writer_assessment.test_phase61_sync===false),noLoss=!!bgeom&&Object.keys(cg||{}).length===Object.keys(bgeom).length&&ALL.every(key=>current[key]!==null&&current[key]!==undefined);report.current_counts=consistency.counts;report.consistency={direction_errors:consistency.direction_errors};report.gates={stable_road_keys:identityOk,geometry_parts_hash_unchanged:partsOk,no_record_loss:noLoss,direction_status_consistent:consistency.direction_status_consistent,no_invalid_or_duplicate_keys:consistency.no_invalid_or_duplicate_keys,asphalt_plan_102_valid:consistency.asphalt_plan_102_valid,nonempty_uncorrupted_state:consistency.nonempty_uncorrupted_state,kortform_fylkeSource_explained_or_corrected:specialExplained};
 const approved=Object.values(report.gates).every(Boolean),records={};for(const key of ALL){const payload=canonicalize(clone(current[key])),h=await hash(current[key],true);records[key]={count:count(current[key]),type:type(current[key]),bytes:h.bytes,sha256:h.sha256,payload};await yieldUi()}
 const fingerprintCore={schema:'kjorelogg-current-canonical-baseline-v1',baseline_kind:'CURRENT',app_version:'v2.0.105',canonical_exclusions:['_bbox'],current_counts:report.current_counts,records},core={...fingerprintCore,created_at:new Date().toISOString()};report.baseline_candidate={approved,blocked_reasons:Object.entries(report.gates).filter(([,v])=>!v).map(([k])=>k),...core,baseline_sha256:(await hash(fingerprintCore)).sha256};return report
 }finally{db.close()}}
function uiReport(report){if(!report?.baseline_candidate)return report;const candidate=report.baseline_candidate,records=Object.fromEntries(Object.entries(candidate.records).map(([key,row])=>[key,{count:row.count,type:row.type,bytes:row.bytes,sha256:row.sha256,payload_captured:true}]));return{...report,baseline_candidate:{...candidate,records}}}
let latest=null;window.addEventListener('error',event=>fail('WINDOW_ERROR',`${event.message} @ ${event.filename||'?'}:${event.lineno||0}:${event.colno||0}`));window.addEventListener('unhandledrejection',event=>fail('UNHANDLED_REJECTION',event.reason?.stack||event.reason?.message||String(event.reason)));
runButton.onclick=async()=>{runButton.disabled=true;downloadButton.disabled=true;visibleSteps=[];try{latest=await run();const visible=uiReport(latest);show(JSON.stringify(visible,null,2));downloadButton.disabled=!latest.baseline_candidate?.approved;window.__PHASE61D_REPORT__=visible;window.__PHASE61D_BASELINE_CANDIDATE__=latest.baseline_candidate}catch(e){latest=null;console.error('FASE 6.1D analysefeil',e);fail(e.code||e.name||'ERROR',e.stack||e.message||String(e))}finally{runButton.disabled=false}};
downloadButton.onclick=()=>{if(!latest?.baseline_candidate?.approved)return;const blob=new Blob([JSON.stringify(latest.baseline_candidate,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kjorelogg-v2.0.105-canonical-baseline-${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
if(location.origin!=="https://oddhoe.github.io"){fail('WRONG_ORIGIN',`Forventet https://oddhoe.github.io, fikk ${location.origin}`)}else if(!globalThis.indexedDB){fail('INDEXEDDB_UNAVAILABLE','IndexedDB API mangler')}else{runButton.disabled=false;show('Klar. Origin OK; analyseknappen er aktivert.')}
})();</script></body></html>
