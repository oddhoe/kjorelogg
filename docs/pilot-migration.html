<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kjørelogg – pilotbarriere</title>
<style>body{margin:0;background:#11151b;color:#edf2f7;font:15px system-ui}main{max-width:680px;margin:auto;padding:24px}section{background:#1b222c;border:1px solid #344150;border-radius:16px;padding:20px}button,a{display:inline-block;border:0;border-radius:10px;padding:12px 16px;background:#1769aa;color:#fff;font-weight:800;text-decoration:none}pre{white-space:pre-wrap;background:#0d1117;padding:14px;border-radius:10px}.danger{color:#ffb8b8}#continue{display:none}</style></head>
<body><main><h1>FASE 5.2 – pilotbarriere</h1><section><p>Denne siden tar et read-only snapshot før Kjørelogg åpner databasen med ny schema-versjon. Fortsett bare på den valgte primærenheten.</p><button id="snapshot">Ta og last ned pre-upgrade snapshot</button> <a id="continue" href="./pilot-index.html?phase5-pilot=1">Åpne pilotappen</a><pre id="status">Ingen database er åpnet.</pre></section></main>
<script src="./sync-local.js"></script><script src="./pre-migration-snapshot.js"></script><script>
(()=>{'use strict';const button=document.getElementById('snapshot'),status=document.getElementById('status'),next=document.getElementById('continue');button.onclick=async()=>{button.disabled=true;try{const snapshots=KjoreloggPreMigrationSnapshot.create({dbName:'nvdb_tiles',deviceId:'pilot-preupgrade',appVersion:'v2.0.96'}),snapshot=await snapshots.build({},null),verification=await snapshots.verify(snapshot);if(!verification.valid)throw new Error('Snapshot SHA-256 mismatch');const readback=JSON.parse(JSON.stringify(snapshot)),second=await snapshots.verify(readback);if(!second.valid)throw new Error('Snapshot readback SHA-256 mismatch');const file=snapshots.exportFile(snapshot);sessionStorage.setItem('kjorelogg_phase5_pilot_proof',JSON.stringify({snapshot_id:snapshot.snapshot_id,content_hash:snapshot.content_hash,source_idb_version:snapshot.source_idb_version,created_at:snapshot.created_at,file}));status.textContent=`PASS read-only database open\nPASS snapshot created\nPASS readback/hash verified\nPASS JSON export generated\n\nDatabaseversjon: ${snapshot.source_idb_version}\nPoster: ${JSON.stringify(snapshot.record_counts)}\nSHA-256: ${snapshot.content_hash}\nFil: ${file}\n\nLagre filen før du fortsetter.`;next.style.display='inline-block'}catch(error){status.className='danger';status.textContent='FAIL '+error.message;button.disabled=false}}})();
</script></body></html>
