<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kjørelogg – pilotbarriere</title>
<style>body{margin:0;background:#11151b;color:#edf2f7;font:15px system-ui}main{max-width:680px;margin:auto;padding:24px}section{background:#1b222c;border:1px solid #344150;border-radius:16px;padding:20px}button,a{display:inline-block;border:0;border-radius:10px;padding:12px 16px;background:#1769aa;color:#fff;font-weight:800;text-decoration:none}pre{white-space:pre-wrap;background:#0d1117;padding:14px;border-radius:10px}.danger{color:#ffb8b8}#continue{display:none}</style></head>
<body><main><h1>FASE 5.2 – pilotbarriere</h1><section><p>Denne siden tar et read-only snapshot før Kjørelogg åpner databasen med ny schema-versjon. Fortsett bare på den valgte primærenheten.</p><button id="snapshot">Ta og last ned pre-upgrade snapshot</button> <a id="continue" href="./pilot-index.html?phase5-pilot=1">Åpne pilotappen</a><pre id="status">Ingen database er åpnet.</pre></section></main>
<script src="./sync-local.js"></script><script src="./pre-migration-snapshot.js"></script><script src="./pilot-idb-recovery.js"></script><script>
(()=>{'use strict';const button=document.getElementById('snapshot'),status=document.getElementById('status'),next=document.getElementById('continue');button.onclick=async()=>{button.disabled=true;try{const snapshots=KjoreloggPreMigrationSnapshot.create({dbName:'nvdb_tiles',deviceId:'pilot-preupgrade',appVersion:'v2.0.100'}),snapshot=await snapshots.build({},null),verification=await snapshots.verify(snapshot);if(!verification.valid)throw new Error(`Snapshot SHA-256 mismatch: expected=${verification.expected} actual=${verification.actual} bytes=${verification.byte_length}`);const readback=structuredClone(snapshot),roundtrip=await snapshots.compareSnapshots(snapshot,readback),second=await snapshots.verify(readback);if(!roundtrip.valid||!second.valid)throw KjoreloggPreMigrationSnapshot.integrityError('Snapshot structured-clone readback mismatch',roundtrip);const db=await KjoreloggPilotIDB.openExisting(indexedDB,'nvdb_tiles');let before;try{before=await KjoreloggPilotIDB.inspect(db,KjoreloggPreMigrationSnapshot.canonicalSnapshotBytes)}finally{db.close()}const file=await snapshots.exportFile(readback);sessionStorage.setItem('kjorelogg_phase5_pilot_proof',JSON.stringify({snapshot_id:snapshot.snapshot_id,content_hash:snapshot.content_hash,source_idb_version:snapshot.source_idb_version,created_at:snapshot.created_at,file,before}));status.textContent=`PASS read-only database open\nPASS snapshot created\nPASS structured-clone/hash verified\nPASS JSON export generated after verification\nPASS v${before.version} connection closed\n\nSHA-256 before: ${roundtrip.hash_before}\nSHA-256 after:  ${roundtrip.hash_after}\nBytes before/after: ${roundtrip.byte_length_before}/${roundtrip.byte_length_after}\nDatabaseversjon: ${snapshot.source_idb_version}\nStores: ${before.stores.join(', ')}\nCounts: ${JSON.stringify(before.counts)}\nAppdata keys: ${before.appdata_keys.join(', ')}\nFil: ${file}\n\nLagre filen, lukk andre Kjørelogg-faner og fortsett.`;next.style.display='inline-block'}catch(error){const d=error.integrity;status.className='danger';status.textContent=d?`FAIL ${error.code}\nSHA-256 før: ${d.hash_before}\nSHA-256 etter: ${d.hash_after}\nBytes før/etter: ${d.byte_length_before}/${d.byte_length_after}\nJSON-path: ${d.first_difference?.path||'<ukjent>'}\nType før/etter: ${d.first_difference?.type_before||'<ukjent>'} / ${d.first_difference?.type_after||'<ukjent>'}\nVerdi før: ${d.first_difference?.value_before||'<ukjent>'}\nVerdi etter: ${d.first_difference?.value_after||'<ukjent>'}`:'FAIL '+error.message;button.disabled=false}}})();
</script></body></html>
