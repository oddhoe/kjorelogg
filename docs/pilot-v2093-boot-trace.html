<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kjørelogg v2.0.93 – read-only boot trace</title><style>body{margin:0;background:#11151b;color:#edf2f7;font:14px system-ui}main{max-width:980px;margin:auto;padding:20px}section{background:#1b222c;border:1px solid #344150;border-radius:14px;padding:18px}button{border:0;border-radius:9px;padding:12px 16px;background:#1769aa;color:white;font-weight:800}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1117;padding:14px;border-radius:10px}.warn{color:#ffd08a}</style></head><body><main><h1>FASE 5.6E – v2.0.93 boot trace</h1><section><p class="warn">Kun lesing. Først kjøres v2.0.93 sitt eksakte <code>indexedDB.open('nvdb_tiles', 3)</code>. Deretter brukes en separat versjonsløs åpning kun for å dokumentere records som v2.0.93 ikke når.</p><button id="run">Kjør read-only boot trace</button><pre id="out">Ikke kjørt.</pre></section></main><script>
(()=>{'use strict';
const DB='nvdb_tiles',V2093_VERSION=3,APP='appdata';

const enc=new TextEncoder(),req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}),hex=b=>[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
function normalize(v){if(v===undefined)return{$type:'undefined'};if(v===null||typeof v!=='object')return typeof v==='number'&&!Number.isFinite(v)?{$type:String(v)}:v;if(Array.isArray(v))return v.map(normalize);const out={};for(const k of Object.keys(v).sort())out[k]=normalize(v[k]);return out}
const bytes=v=>enc.encode(JSON.stringify(normalize(v))),sha=async v=>hex(await crypto.subtle.digest('SHA-256',bytes(v)));
function tag(v){if(v===null)return'null';if(Array.isArray(v))return'array';return typeof v}
function count(v){if(Array.isArray(v))return v.length;if(v&&typeof v==='object')return Object.keys(v).length;return v==null?0:1}
function statusCounts(v){return{driven:Array.isArray(v?.driven)?v.driven.length:0,oneWay:Array.isArray(v?.oneWay)?v.oneWay.length:0,skip:Array.isArray(v?.skip)?v.skip.length:0,deletedGeom:Array.isArray(v?.deletedGeom)?v.deletedGeom.length:Array.isArray(v?.deletedGeomKeys)?v.deletedGeomKeys.length:0}}
function geomParse(raw){const out={};for(const[key,val]of Object.entries(raw||{})){if(Array.isArray(val))out[key]={parts:val};else if(val&&typeof val==='object'&&Array.isArray(val.parts))out[key]={...val,parts:val.parts}}return out}
function exactV2093Open(){return new Promise(resolve=>{let request;try{request=indexedDB.open(DB,V2093_VERSION)}catch(error){resolve({status:'THROW',name:error.name,message:error.message});return}request.onupgradeneeded=()=>{try{request.transaction.abort()}catch(_){}resolve({status:'UNEXPECTED_UPGRADE_ABORTED',oldVersion:request.transaction?.db?.version})};request.onsuccess=()=>{const version=request.result.version;request.result.close();resolve({status:'PASS',version})};request.onerror=()=>resolve({status:'FAIL',name:request.error?.name||'Error',message:request.error?.message||''});request.onblocked=()=>resolve({status:'BLOCKED'})})}
async function forensicOpen(){if(typeof indexedDB.databases==='function'){const all=await indexedDB.databases(),hit=all.find(x=>x.name===DB);if(!hit)throw new Error(`${DB} finnes ikke`)}return new Promise((ok,no)=>{const r=indexedDB.open(DB);let upgrade=false;r.onupgradeneeded=()=>{upgrade=true;r.transaction.abort()};r.onsuccess=()=>upgrade?(r.result.close(),no(new Error('onupgradeneeded abortert'))):ok(r.result);r.onerror=()=>no(r.error||new Error('open feilet'))})}
async function rawRecord(db,key){return req(db.transaction(APP,'readonly').objectStore(APP).get(key))}
async function describe(key,raw){const unwrapped=raw?.value??null,base={key,record_wrapper_type:tag(raw),wrapper_keys:raw&&typeof raw==='object'?Object.keys(raw).sort():[],wrapper_bytes:bytes(raw).length,wrapper_sha256:await sha(raw),idbGetAppData_return_type:tag(unwrapped),idbGetAppData_count:count(unwrapped),idbGetAppData_bytes:bytes(unwrapped).length,idbGetAppData_sha256:await sha(unwrapped)};if(key==='mr_veg_nvdb_state')base.transform={before:count(unwrapped),after:statusCounts(unwrapped),runtime:statusCounts(unwrapped)};else if(key==='mr_veg_geom_v2'){const parsed=geomParse(unwrapped);base.transform={before:count(unwrapped),after:count(parsed),runtime:count(parsed),rejected:count(unwrapped)-count(parsed)}}else if(key==='__kjorelogg_progress_state_v3')base.transform={before:count(unwrapped),after:{state:statusCounts(unwrapped?.state),directionState:count(unwrapped?.directionState),routeLog:count(unwrapped?.routeLog),geomCache:count(geomParse(unwrapped?.geomCache)),roadComments:count(unwrapped?.roadComments)},runtime:'fallback only if corresponding runtime field is empty'};else base.transform={before:count(unwrapped),after:count(unwrapped),runtime:count(unwrapped)};return base}
function localTrace(){const rows=[];for(const key of KEYS){let value=null,error=null;try{value=localStorage.getItem(key)}catch(e){error=e.name}rows.push({key,present:value!==null,bytes:value===null?0:enc.encode(value).length,error})}return rows}
async function run(){const report={mode:'READ_ONLY',writes:false,v2093:{IDB_NAME:DB,IDB_VER:V2093_VERSION},steps:[]};const local=localTrace();report.steps.push({step:'localStorage',output:local});const open=await exactV2093Open();report.steps.push({step:"openIDB → indexedDB.open('nvdb_tiles', 3)",output:open});if(open.status!=='PASS'){report.first_divergence={step:'openIDB',input:{database_actual_version:(await indexedDB.databases()).find(x=>x.name===DB)?.version??null,requested_version:3},output:open,effect:'idbGetAppData kan ikke starte; hydrateLargeStoresFromIDB fanger feilen og beholder tom runtime-state'};}

})();
</script></body></html>
