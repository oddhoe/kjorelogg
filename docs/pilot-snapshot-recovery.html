<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kjørelogg – kontrollert snapshot-recovery</title>
<style>body{margin:0;background:#11151b;color:#edf2f7;font:14px system-ui}main{max-width:900px;margin:auto;padding:20px}section{background:#1b222c;border:1px solid #344150;border-radius:14px;padding:18px;margin:12px 0}button,input{padding:11px;border-radius:9px;border:1px solid #4b5969;background:#202a36;color:#fff}button{background:#1769aa;font-weight:800}.danger{background:#8b1e28}.locked{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1117;padding:14px;border-radius:10px}.warn{color:#ffd08a}</style></head><body><main>
<h1>FASE 5.6D – atomisk lokal recovery</h1><section><p class="warn">Kun snapshot <code>snap-20260821-100219</code> kan brukes. Ingen Supabase-, sync-, outbox-, schema- eller asfaltkode lastes.</p><button id="preflight">1. Read-only preflight</button><pre id="status">Ikke startet.</pre></section>
<section><button id="dbbackup" disabled>2. Last ned komplett IndexedDB-backup</button> <button id="snapbackup" disabled>3. Last ned uendret snapshot-record</button><p><label><input type="checkbox" id="dbsaved"> Jeg har lagret IndexedDB-backupen</label><br><label><input type="checkbox" id="snapsaved"> Jeg har lagret snapshot-backupen</label></p></section>
<section><p>Skriv eksakt: <code>GJENOPPRETT SNAPSHOT 100219</code></p><input id="phrase" autocomplete="off" size="38"><button id="restore" class="danger" disabled>Gjenopprett aktiv lokal state atomisk</button><pre id="result">Recovery er låst.</pre></section>
</main><script src="./canonical-model.js"></script><script>
(()=>{'use strict';
const DB='nvdb_tiles',SNAP_STORE='progress_snapshots',APP='appdata',SNAP_KEY='snap-20260821-100219',EXPECTED_SNAPSHOT_SHA='b6190a48646318af318e56b7647fabc520ba141269e6752c4df415c3ad0a697c';
const TARGET={state:'mr_veg_nvdb_state',direction:'mr_veg_dir_state_v1',route:'mr_veg_route_log_v1',geom:'mr_veg_geom_v2',comments:'mr_veg_road_comments_v1',snapshot:'__kjorelogg_progress_state_v3'};
const EXPECTED={roads:8097,COMPLETED:327,ONE_DIRECTION:0,SKIPPED:138,NOT_STARTED:7632,geometry:8005,comments:8,route:188,direction:327};
const enc=new TextEncoder(),status=document.getElementById('status'),result=document.getElementById('result');let context=null,dbDownloaded=false,snapshotDownloaded=false;
function normalize(value,seen=new WeakSet()){if(value===undefined)return{$type:'undefined'};if(value===null||typeof value==='string'||typeof value==='boolean')return value;if(typeof value==='number')return Number.isFinite(value)?value:{$type:String(value)};if(value instanceof Date)return{$type:'Date',value:value.toISOString()};if(value instanceof ArrayBuffer)return{$type:'ArrayBuffer',bytes:[...new Uint8Array(value)]};if(ArrayBuffer.isView(value))return{$type:value.constructor.name,bytes:[...new Uint8Array(value.buffer,value.byteOffset,value.byteLength)]};if(value instanceof Blob)return{$type:'Blob',size:value.size,mime:value.type};if(value instanceof Map)return{$type:'Map',entries:[...value.entries()].map(([k,v])=>[normalize(k,seen),normalize(v,seen)]).sort((a,b)=>JSON.stringify(a[0]).localeCompare(JSON.stringify(b[0])))};if(value instanceof Set)return{$type:'Set',values:[...value].map(v=>normalize(v,seen)).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)))};if(Array.isArray(value))return value.map(v=>normalize(v,seen));if(typeof value==='object'){if(seen.has(value))throw new Error('Sirkelreferanse kan ikke eksporteres sikkert');seen.add(value);const out={};for(const key of Object.keys(value).sort())out[key]=normalize(value[key],seen);seen.delete(value);return out}return{$type:typeof value}}
const canonical=value=>JSON.stringify(normalize(value)),bytes=value=>enc.encode(canonical(value)),hex=b=>[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join(''),sha=async value=>hex(await crypto.subtle.digest('SHA-256',bytes(value))),req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function openExisting(){if(typeof indexedDB.databases==='function'){const all=await indexedDB.databases();if(!all.some(x=>x.name===DB))throw new Error(`${DB} finnes ikke`)}return new Promise((ok,no)=>{const r=indexedDB.open(DB);let upgrade=false;r.onupgradeneeded=()=>{upgrade=true;r.transaction.abort()};r.onsuccess=()=>upgrade?(r.result.close(),no(new Error('onupgradeneeded ble abortert'))):ok(r.result);r.onerror=()=>no(r.error||new Error('IDB-open feilet'));r.onblocked=()=>no(new Error('IDB-open blocked'))})}
async function rows(db,name){const tx=db.transaction(name,'readonly'),store=tx.objectStore(name),[keys,values]=await Promise.all([req(store.getAllKeys()),req(store.getAll())]);return keys.map((key,i)=>({key:String(key),value:values[i]}))}
function download(name,text){const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function isOneWay(key,geom){const g=geom?.[key]||{},text=String(key),d=text.match(/S\d+D(\d+)/i);return !!g.gsv||!!(d&&Number(d[1])>=100)||/rampe|rundkj|konnektering|sideanlegg/i.test([g.typeVegText,g.typeVeg,g.detaljnivaa,g.seg].join(' '))}
function canonicalReport(s){const state=s.state||{},payload={drivenKeys:new Set(state.driven||[]),oneWayKeys:new Set(state.oneWay||[]),skipKeys:new Set(state.skip||[]),deletedGeomKeys:new Set(state.deletedGeom||state.deletedGeomKeys||[]),directionState:s.directionState||{},routeLog:s.routeLog||{},geomCache:s.geomCache||{},roadComments:s.roadComments||{},asphaltPlan:[]},roads=KjoreloggCanonical.resolveCanonicalRoadProgress(payload,{isOneWay:key=>isOneWay(key,payload.geomCache)}),counts={COMPLETED:0,ONE_DIRECTION:0,SKIPPED:0,NOT_STARTED:0};for(const row of roads)counts[row.status]++;return{roads:roads.length,...counts,geometry:Object.keys(payload.geomCache).length,comments:Object.keys(payload.roadComments).length,route:Object.keys(payload.routeLog).length,direction:Object.keys(payload.directionState).length}}
function assertExpected(report){for(const [key,value] of Object.entries(EXPECTED))if(report[key]!==value)throw new Error(`Preflight mismatch ${key}: expected ${value}, got ${report[key]}`)}
async function buildDbExport(db){const stores={};for(const name of db.objectStoreNames)stores[name]=await rows(db,name);const database={name:db.name,version:db.version,stores:[...db.objectStoreNames]},content={database,stores};return{export:{format:'kjorelogg-indexeddb-forensic-v1',database,created_at:new Date().toISOString(),stores},content}}
async function preflight(){const db=await openExisting();try{if(!db.objectStoreNames.contains(APP)||!db.objectStoreNames.contains(SNAP_STORE))throw new Error('Påkrevde stores mangler');const snapshot=await req(db.transaction(SNAP_STORE,'readonly').objectStore(SNAP_STORE).get(SNAP_KEY));if(!snapshot)throw new Error(`Snapshot ${SNAP_KEY} finnes ikke`);const snapshotSha=await sha(snapshot);if(snapshotSha!==EXPECTED_SNAPSHOT_SHA)throw new Error(`Snapshot SHA mismatch: ${snapshotSha}`);const report=canonicalReport(snapshot);assertExpected(report);const built=await buildDbExport(db),dbExport=built.export,dbText=canonical(dbExport),snapshotText=canonical(snapshot),targets={[TARGET.state]:snapshot.state||{},[TARGET.direction]:snapshot.directionState||{},[TARGET.route]:snapshot.routeLog||{},[TARGET.geom]:snapshot.geomCache||{},[TARGET.comments]:snapshot.roadComments||{},[TARGET.snapshot]:snapshot},targetHashes={};for(const [key,value] of Object.entries(targets))targetHashes[key]=await sha(value);return{snapshot,snapshotSha,report,dbExport,dbText,snapshotText,targets,targetHashes,dbExportSha:await sha(dbExport),dbContentSha:await sha(built.content),snapshotExportSha:await sha(snapshot)}}finally{db.close()}}
function updateGate(){document.getElementById('restore').disabled=!(context&&dbDownloaded&&snapshotDownloaded&&document.getElementById('dbsaved').checked&&document.getElementById('snapsaved').checked&&document.getElementById('phrase').value==='GJENOPPRETT SNAPSHOT 100219')}
document.getElementById('preflight').onclick=async()=>{try{context=await preflight();status.textContent=`PASS snapshot SHA ${context.snapshotSha}\nPASS canonical preflight ${JSON.stringify(context.report)}\nDB content SHA ${context.dbContentSha}\nDB backup file SHA ${context.dbExportSha}\nSnapshot export SHA ${context.snapshotExportSha}\nIngen writes utført.`;document.getElementById('dbbackup').disabled=false;document.getElementById('snapbackup').disabled=false}catch(error){context=null;status.textContent='ABORT: '+error.message;result.textContent='Recovery forblir låst.'}updateGate()};
document.getElementById('dbbackup').onclick=()=>{if(!context)return;download(`kjorelogg-full-idb-before-recovery-${Date.now()}.json`,context.dbText);dbDownloaded=true;updateGate()};document.getElementById('snapbackup').onclick=()=>{if(!context)return;download(`${SNAP_KEY}-unaltered.json`,context.snapshotText);snapshotDownloaded=true;updateGate()};for(const id of['dbsaved','snapsaved','phrase'])document.getElementById(id).addEventListener('input',updateGate);
async function atomicRestore(){
 const fresh=await preflight();if(fresh.snapshotSha!==context.snapshotSha||fresh.dbContentSha!==context.dbContentSha)throw new Error('Database eller snapshot endret etter backup; kjør preflight og eksporter på nytt');
 const db=await openExisting();try{const tx=db.transaction(APP,'readwrite'),store=tx.objectStore(APP),stamp=Date.now(),expectedStrings={};for(const [key,value] of Object.entries(fresh.targets)){expectedStrings[key]=canonical(value);store.put({value,ts:stamp},key)}let mismatch=null,pending=Object.keys(fresh.targets).length;for(const key of Object.keys(fresh.targets)){const r=store.get(key);r.onsuccess=()=>{const logical=r.result&&typeof r.result==='object'&&Object.hasOwn(r.result,'value')?r.result.value:r.result;if(canonical(logical)!==expectedStrings[key])mismatch=`Readback mismatch ${key}`;if(--pending===0&&mismatch)try{tx.abort()}catch(_){}};r.onerror=()=>{mismatch=`Readback error ${key}`;try{tx.abort()}catch(_){}}}await new Promise((ok,no)=>{tx.oncomplete=()=>mismatch?no(new Error(mismatch)):ok();tx.onabort=()=>no(new Error(mismatch||tx.error?.message||'Recovery-transaksjon abortert'));tx.onerror=()=>no(tx.error||new Error('Recovery-transaksjon feilet'))})}finally{db.close()}
 const verifyDb=await openExisting();try{const map=new Map((await rows(verifyDb,APP)).map(row=>[row.key,row.value?.value??row.value]));for(const [key,value] of Object.entries(fresh.targets)){const actual=map.get(key),actualSha=await sha(actual);if(actualSha!==fresh.targetHashes[key])throw new Error(`POST-VERIFY SHA mismatch ${key}`)}const restored={state:map.get(TARGET.state),directionState:map.get(TARGET.direction),routeLog:map.get(TARGET.route),geomCache:map.get(TARGET.geom),roadComments:map.get(TARGET.comments)},report=canonicalReport(restored);assertExpected(report);return{report,targetHashes:fresh.targetHashes}}finally{verifyDb.close()}
}
document.getElementById('restore').onclick=async()=>{document.getElementById('restore').disabled=true;try{const verified=await atomicRestore();result.textContent=`PASS atomisk recovery\nPASS canonical counts ${JSON.stringify(verified.report)}\nPASS logical SHA readback for ${Object.keys(verified.targetHashes).length} records\nIngen Supabase/sync/outbox/schema/asfalt-operasjoner utført.`}catch(error){result.textContent='ABORT: '+error.message+'\nIngen videre writes utføres.'}};
})();
</script></body></html>
