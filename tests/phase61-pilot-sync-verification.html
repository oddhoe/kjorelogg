<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FASE 6.1 pilot sync</title><style>:root{color-scheme:dark;font-family:system-ui}body{max-width:900px;margin:2rem auto;background:#111;color:#eee;padding:1rem}input,button{display:block;width:100%;padding:.7rem;margin:.5rem 0}pre{white-space:pre-wrap;background:#080808;padding:1rem}.pass{color:#7eebae}.fail{color:#ff7777}</style></head><body><h1>FASE 6.1 – isolert pilot-sync</h1><p>Bruker bare <code>nvdb_tiles_phase61_test</code> og <code>TEST_PHASE61_*</code>. Passord logges/lagres ikke.</p><input id="ea" value="odderling@gmail.com"><input id="pa" type="password" placeholder="TEST_A passord"><input id="eb" value="odderling@duck.com"><input id="pb" type="password" placeholder="TEST_B passord"><button id="run">Kjør ekte pilot-sync-test</button><pre id="out">Venter.</pre>
<script src="../docs/config.js?v=2.0.105"></script><script src="../docs/vendor/supabase.min.js"></script><script src="../docs/sync-local.js"></script><script src="../docs/sync-engine.js"></script><script src="../docs/pilot-sync-v105.js?v=2.0.105"></script><script>
(()=>{'use strict';const out=document.getElementById('out');let lines=[];const line=(s,k='PASS')=>{lines.push(`${k} ${s}`);out.textContent=lines.join('\n');out.className=k==='FAIL'?'fail':'pass'},fail=(s,e)=>{line(`${s}: ${e?.code||'ERROR'} ${e?.message||e}`,'FAIL');throw e||new Error(s)},cfg=KJORELOGG_CONFIG,dbName='nvdb_tiles_phase61_test';
const makeClient=()=>supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),auth=c=>({getClient:()=>c,getSession:async()=> (await c.auth.getSession()).data.session});
async function login(c,email,password,label){const r=await c.auth.signInWithPassword({email,password});if(r.error)fail(label,r.error);line(`${label} login`);return r.data.user}async function pending(local,key){return(await local.listAll()).filter(x=>x.entity_key===key&&x.state!=='done')}
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;const pa=document.getElementById('pa').value,pb=document.getElementById('pb').value,ea=document.getElementById('ea').value,eb=document.getElementById('eb').value;document.getElementById('pa').value='';document.getElementById('pb').value='';let dataset=null,a=null,b=null;try{if(!pa||!pb)throw new Error('Begge passord kreves');a=makeClient();b=makeClient();const ua=await login(a,ea,pa,'TEST_A'),ub=await login(b,eb,pb,'TEST_B');let online=true;const localA=KjoreloggSyncLocal.create({dbName}),localB=KjoreloggSyncLocal.create({dbName:`${dbName}_b`});await localA.initialize();await localB.initialize();const ca=KjoreloggPilotSyncV105.create({auth:auth(a),local:localA,online:()=>online}),cb=KjoreloggPilotSyncV105.create({auth:auth(b),local:localB,online:()=>online});dataset=await ca.createTestDataset('FASE 6.1 isolated pilot');await a.rpc('add_dataset_member',{p_dataset_id:dataset.id,p_user_id:ub.id,p_role:'driver'}).then(r=>{if(r.error)fail('Add TEST_B',r.error)});await cb.selectDataset(dataset);line('Shared TEST_PHASE61 dataset selected');
const keyA=`TEST_PHASE61_ROAD_${Date.now()}`;await ca.enqueueRoad({road_key:keyA,status:'ONE_DIRECTION',comment:'pilot'});let r=await ca.syncNow();if(r.error||r.pushed!==1)fail('Initial sync',r.error||new Error(JSON.stringify(r)));if(r.trace.join('|')!=='version-check|server-preflight|pull|lease-check/acquire|push-outbox')fail('Ordering',new Error(r.trace.join(' → ')));line('Preflight/pull/lease/push ordering');
r=await cb.syncNow();if(r.error?.code!=='PT423'||cb.getState().phase!=='locked')fail('Second driver lock',r.error||new Error(JSON.stringify(r)));line('Second-driver PT423 mapped to locked state');
online=false;const offlineKey=`TEST_PHASE61_OFFLINE_${Date.now()}`;await ca.enqueueRoad({road_key:offlineKey,status:'COMPLETED'});r=await ca.syncNow();if(r.skipped!=='offline'||(await pending(localA,offlineKey)).length!==1)fail('Offline queue',new Error(JSON.stringify(r)));line('Offline mutation retained');const localRestart=KjoreloggSyncLocal.create({dbName});await localRestart.initialize();const restart=KjoreloggPilotSyncV105.create({auth:auth(a),local:localRestart,online:()=>online});await restart.restoreSelection();if(restart.getState().pending<1)fail('Restart persistence',new Error('pending missing'));line('Outbox survived repository restart');online=true;r=await restart.syncNow();if(r.error||(await pending(localRestart,offlineKey)).length)fail('Reconnect',r.error||new Error('pending remained'));line('Reconnect ran pull-before-push and acknowledged outbox');
const conflictKey=`TEST_PHASE61_CONFLICT_${Date.now()}`;await restart.enqueueRoad({road_key:conflictKey,status:'COMPLETED'});r=await restart.syncNow();if(r.error)fail('Conflict seed',r.error);await restart.release();r=await cb.syncNow();if(r.error)fail('B takeover after release',r.error);await cb.enqueueRoad({road_key:conflictKey,status:'ONE_DIRECTION'});r=await cb.syncNow();if(r.error)fail('B concurrent update',r.error);await ca.enqueueRoad({road_key:conflictKey,status:'SKIPPED'});r=await ca.syncNow();const conflict=(await localA.findPending('road_progress',conflictKey));if(conflict?.state!=='conflict'||!conflict.conflict?.local_payload||!conflict.conflict?.server_payload)fail('Conflict preservation',new Error(JSON.stringify(conflict)));line('Stale client pulled first and preserved both conflict payloads');
await a.rpc('cleanup_test_dataset',{p_dataset_id:dataset.id}).then(x=>{if(x.error)fail('Cleanup',x.error);line(`Cleanup ${JSON.stringify(x.data)}`)});const check=await a.from('datasets').select('id',{count:'exact',head:true}).eq('id',dataset.id);if(check.error||check.count!==0)fail('Cleanup verify',check.error||new Error(`count=${check.count}`));line('0 TEST_PHASE61 server datasets remain');await a.auth.signOut();await b.auth.signOut();line('PHASE 6.1 PILOT SYNC RUNTIME COMPLETE')
}catch(e){if(!out.classList.contains('fail'))fail('Runtime',e)}}})();
</script></body></html>
